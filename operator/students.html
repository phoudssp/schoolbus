<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phetaloun — Students</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sr-sidebar"></aside>
  <div class="app-main">
    <header class="sr-topbar"></header>
    <div class="app-content">

      <div class="sr-page-head">
        <div>
          <div class="sr-breadcrumb">
            <a href="index.html">ຜູ້ດຳເນີນການ</a>
            <i data-lucide="chevron-right"></i>
            <span>ນັກຮຽນ</span>
          </div>
          <h1 class="sr-page-title">ນັກຮຽນ</h1>
          <p class="sr-page-sub">All registered students with assigned bus stops, parent links, and home location pins.</p>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="sr-btn sr-btn-ghost"><i data-lucide="upload"></i>ນຳເຂົ້າ CSV</button>
          <button id="addBtn" class="sr-btn sr-btn-primary"><i data-lucide="user-plus"></i>ລົງທະບຽນນັກຮຽນ</button>
        </div>
      </div>

      <!-- Filter row -->
      <div class="sr-card" style="padding: 14px 18px; margin-bottom: 16px;">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
          <div class="sr-search" style="flex: 1; max-width: 300px;">
            <i data-lucide="search"></i>
            <input id="search" placeholder="ຄົ້ນຫາຕາມຊື່ ຫຼື ລະຫັດ…">
          </div>
          <select id="schoolFilter" class="sr-select" style="max-width: 200px;">
            <option value="">ໂຮງຮຽນທັງໝົດ</option>
          </select>
          <select id="gradeFilter" class="sr-select" style="max-width: 160px;">
            <option value="">ລະດັບທັງໝົດ</option>
          </select>
          <span style="margin-left: auto;" class="text-text-3" id="countLabel">— students</span>
        </div>
      </div>

      <!-- Table -->
      <div class="sr-table-wrap">
        <table class="sr-table">
          <thead>
            <tr>
              <th>ນັກຮຽນ</th>
              <th>ໂຮງຮຽນ</th>
              <th>ຜູ້ປົກຄອງ</th>
              <th>ຈຸດຮັບທີ່ບ້ານ</th>
              <th>ຕຳແໜ່ງເຮືອນ</th>
              <th>ບັດ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/ui.js"></script>
<script>
srMount({ role: 'operator', active: 'students', user: { name: 'Souvanh P.', role: 'Super Admin', initials: 'SP' } });

// ---------- Filters ----------
const sf = document.getElementById('schoolFilter');
APP_DATA.schools.forEach(s => sf.insertAdjacentHTML('beforeend', `<option value="${s.id}">${srEscape(s.name)}</option>`));
const gf = document.getElementById('gradeFilter');
['Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6'].forEach(g => gf.insertAdjacentHTML('beforeend', `<option value="${g}">${g}</option>`));
sf.addEventListener('change', render);
gf.addEventListener('change', render);
document.getElementById('search').addEventListener('input', render);

const COLOR_BY_SCHOOL = id => (APP_DATA.byId.school[id] || {}).color || '#64748B';

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const fs = sf.value, fg = gf.value;
  const list = APP_DATA.students.filter(s =>
    (!fs || s.schoolId === fs) &&
    (!fg || s.grade === fg) &&
    (!q || s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q))
  );
  document.getElementById('countLabel').textContent = list.length + ' student' + (list.length !== 1 ? 's' : '');
  const tbody = document.getElementById('rows');
  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="sr-empty"><i data-lucide="users"></i><div>No students found.</div></div></td></tr>`;
    srIcons();
    return;
  }
  tbody.innerHTML = list.map(s => {
    const school = APP_DATA.byId.school[s.schoolId];
    const guardian = s.guardianId ? APP_DATA.byId.guardian[s.guardianId] : null;
    const stop = APP_DATA.stops[s.stopId];
    const hasHouse = !!s.house && !!s.house.coords;
    return `
      <tr>
        <td>
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="sr-avatar lg" style="background:${school.color}22; color:${school.color};">${srInitials(s.name)}</div>
            <div>
              <div style="font-weight: 700;">${srEscape(s.name)}</div>
              <div class="text-text-3 sr-mono" style="font-size: 11px;">${s.id} · ${srEscape(s.grade)}</div>
            </div>
          </div>
        </td>
        <td><span style="color:${school.color}; font-weight: 700;">${srEscape(school.shortName)}</span></td>
        <td>${guardian ? srEscape(guardian.name) : '<span class="text-text-4">—</span>'}</td>
        <td class="text-text-2" style="font-size: 12px;">${stop ? srEscape(stop.name) : '—'}</td>
        <td>
          ${hasHouse
            ? `<button onclick="pinHouse('${s.id}')" class="sr-btn sr-btn-sm sr-btn-ghost"><i data-lucide="map-pin"></i> Pinned</button>`
            : `<button onclick="pinHouse('${s.id}')" class="sr-btn sr-btn-sm sr-btn-yellow"><i data-lucide="map-pin-plus"></i> Pin house</button>`}
        </td>
        <td>
          <button onclick="viewCard('${s.id}')" class="sr-btn sr-btn-sm sr-btn-ghost"><i data-lucide="badge"></i> ID card</button>
        </td>
        <td style="text-align: right; white-space: nowrap;">
          <button class="sr-icon-btn" onclick="editStudent('${s.id}')" title="Edit"><i data-lucide="pencil"></i></button>
          <button class="sr-icon-btn" onclick="deleteStudent('${s.id}')" title="Delete"><i data-lucide="trash-2"></i></button>
        </td>
      </tr>
    `;
  }).join('');
  srIcons();
}

// ---------- Add / Edit ----------
function studentFields(s) {
  const stops = Object.entries(APP_DATA.stops).filter(([id, stop]) => !stop.isSchool).map(([id, stop]) => ({ value: id, label: stop.name }));
  return [
    { key: 'name',  label: 'ຊື່ເຕັມ', type: 'text', required: true, placeholder: 'ຊື່ນັກຮຽນ' },
    { key: 'grade', label: 'ລະດັບ', type: 'select', required: true, options: ['Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6'], default: 'Grade 1' },
    { key: 'schoolId', label: 'ໂຮງຮຽນ', type: 'select', required: true, options: APP_DATA.schools.map(x => ({ value: x.id, label: x.name })) },
    { key: 'stopId',   label: 'ຈຸດຮັບທີ່ບ້ານ', type: 'select', required: true, options: stops },
    { key: 'guardianId', label: 'ຜູ້ປົກຄອງ', type: 'select', placeholder: 'Pick a parent', options: APP_DATA.guardians.map(g => ({ value: g.id, label: g.name + ' · ' + g.phone })) }
  ];
}
document.getElementById('addBtn').addEventListener('click', () => {
  srModal({
    title: 'ລົງທະບຽນນັກຮຽນ',
    fields: studentFields(),
    onSave: data => {
      if (!data.name) return false;
      const id = srNewId('S', APP_DATA.students);
      const school = APP_DATA.byId.school[data.schoolId];
      const today = new Date().toISOString().slice(0, 10);
      const newS = {
        id, name: data.name, grade: data.grade, schoolId: data.schoolId,
        stopId: data.stopId, guardianId: data.guardianId || null,
        qrToken: `${school.shortName.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3) || 'SR'}-${id.split('-')[1]}-${Math.random().toString(16).slice(2,6).toUpperCase()}`,
        nfcUid: nfcUidFor(id),
        cardIssuedAt: today,
        photoInitials: srInitials(data.name),
        registeredAt: today, status: 'active',
        house: null
      };
      APP_DATA.students.push(newS);
      APP_DATA.byId.student[id] = newS;
      if (data.guardianId) {
        const g = APP_DATA.byId.guardian[data.guardianId];
        if (g && !g.studentIds.includes(id)) g.studentIds.push(id);
      }
      srToast('✓ ລົງທະບຽນນັກຮຽນແລ້ວ — ອອກບັດອັດຕະໂນມັດ (NFC + QR)');
      render();
      setTimeout(() => pinHouse(id), 400);
    }
  });
});

window.editStudent = function(id) {
  const s = APP_DATA.byId.student[id];
  srModal({
    title: 'Edit — ' + s.name,
    fields: studentFields(s),
    values: s,
    onSave: data => {
      Object.assign(s, { name: data.name, grade: data.grade, schoolId: data.schoolId, stopId: data.stopId, guardianId: data.guardianId || null });
      srToast('✓ ບັນທຶກແລ້ວ');
      render();
    }
  });
};

window.deleteStudent = function(id) {
  const s = APP_DATA.byId.student[id];
  srConfirm({ title: 'ລຶບ ' + s.name + '?', message: 'ລະບົບຈະລຶບນັກຮຽນ ແລະ ຂໍ້ມູນທີ່ກ່ຽວຂ້ອງ.', danger: true,
    onYes: () => { APP_DATA.students = APP_DATA.students.filter(x => x.id !== id); delete APP_DATA.byId.student[id]; srToast('✓ ລຶບແລ້ວ'); render(); }
  });
};

// ---------- Pin house location ----------
window.pinHouse = function(id) {
  const s = APP_DATA.byId.student[id];
  const overlay = document.createElement('div');
  overlay.className = 'sr-modal-bg';
  overlay.innerHTML = `
    <div class="sr-modal" style="max-width: 720px;">
      <div class="sr-modal-head">
        <div>
          <h3 class="sr-modal-title">Pin house — ${srEscape(s.name)}</h3>
          <p class="text-text-3" style="font-size: 12px; margin: 2px 0 0;">Click anywhere on the map to drop the pickup pin. We optimize routes to deliver to the front door.</p>
        </div>
        <button class="sr-icon-btn" data-close><i data-lucide="x"></i></button>
      </div>
      <div class="sr-modal-body" style="padding: 0;">
        <div id="pinMap" style="height: 400px;"></div>
        <div style="padding: 14px 20px; background: var(--sr-muted); border-top: 1px solid var(--sr-border);">
          <div class="sr-field">
            <label class="sr-label">Address line</label>
            <input id="pinAddr" class="sr-input" value="${srEscape(s.house ? s.house.addressLine : '')}" placeholder="e.g. Ban Houayxai, House #42">
          </div>
        </div>
      </div>
      <div class="sr-modal-foot">
        <button class="sr-btn sr-btn-ghost" data-close>ຍົກເລີກ</button>
        <button class="sr-btn sr-btn-primary" id="savePin"><i data-lucide="save"></i> Save pin</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  srIcons();
  overlay.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => overlay.remove()));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  const stop = APP_DATA.stops[s.stopId];
  const center = (s.house && s.house.coords) || (stop ? stop.coords : APP_DATA.operator.center);
  const pmap = L.map('pinMap', { zoomControl: true, attributionControl: false }).setView(center, 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(pmap);
  // Show the assigned stop for reference
  if (stop) {
    L.marker(stop.coords, { icon: L.divIcon({ className: '', html: `<div class="bus-marker-div at_stop">🚏 ${stop.name}</div>`, iconSize: [120, 28], iconAnchor: [60, 14] }) }).addTo(pmap);
  }
  let pinMarker = L.marker(center, { draggable: true, icon: L.divIcon({ className: '', html: `<div style="font-size: 32px; line-height: 1; transform: translate(-50%, -100%);">🏠</div>`, iconSize: [32, 32], iconAnchor: [16, 32] }) }).addTo(pmap);
  pmap.on('click', e => pinMarker.setLatLng(e.latlng));

  document.getElementById('savePin').addEventListener('click', () => {
    const ll = pinMarker.getLatLng();
    s.house = { coords: [ll.lat, ll.lng], addressLine: document.getElementById('pinAddr').value || (stop ? stop.name : '') };
    overlay.remove();
    srToast('✓ ປັກໝຸດເຮືອນສຳເລັດ ' + s.name);
    render();
  });
  setTimeout(() => pmap.invalidateSize(), 100);
};

// ---------- ID card view (NFC + QR card, 2-sided) ----------
window.viewCard = function(id) {
  const s = APP_DATA.byId.student[id];
  const school = APP_DATA.byId.school[s.schoolId];
  const overlay = document.createElement('div');
  overlay.className = 'sr-modal-bg';
  overlay.innerHTML = `
    <div class="sr-modal" style="max-width: 760px;">
      <div class="sr-modal-head">
        <h3 class="sr-modal-title">ID card — ${srEscape(s.name)}</h3>
        <button class="sr-icon-btn" data-close><i data-lucide="x"></i></button>
      </div>
      <div class="sr-modal-body" style="background: var(--sr-bg);">
        <style>
          /* Lanyard cord SVG block sits above the card; the card has a slot for the clip */
          .lanyard-cord { display:block; margin: 0 auto -2px; }
          .id-card-portrait {
            width: 280px; aspect-ratio: 1 / 1.586; border-radius: 14px;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
          }
          .id-card-portrait .lanyard-hole {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 44px; height: 6px; border-radius: 999px;
            background: rgba(0,0,0,0.45);
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.25);
            z-index: 5;
          }
        </style>
        <div style="display:flex; gap: 28px; flex-wrap: wrap; justify-content: center;">
          <!-- ============ FRONT ============ -->
          <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="text-text-3" style="font-size: 10px; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 6px;">ດ້ານໜ້າ</div>
            <!-- Lanyard cord -->
            <svg class="lanyard-cord" width="140" height="34" viewBox="0 0 140 34">
              <path d="M 8 8 Q 70 38 132 8" stroke="#29ABE2" stroke-width="3" fill="none" stroke-linecap="round"/>
              <rect x="62" y="22" width="16" height="10" rx="2" fill="#94A3B8" stroke="#64748B" stroke-width="1"/>
            </svg>
            <!-- Card -->
            <div class="id-card-portrait" style="background: linear-gradient(160deg, #0E4D92, #134AA6 55%, #1A5BB8); color: white; box-shadow: 0 14px 30px rgba(14,77,146,0.3);">
              <div class="lanyard-hole"></div>
              <!-- Brand bar -->
              <div style="margin-top: 30px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 11px;">
                  <span style="background: white; color: #0E4D92; width: 22px; height: 22px; border-radius: 5px; display:flex; align-items:center; justify-content:center; font-weight: 900; font-size: 13px;">P</span>
                  Phetaloun
                </div>
                <span style="background:${school.color}; color: white; font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 800;">${srEscape(school.shortName)}</span>
              </div>
              <!-- Photo -->
              <div style="margin: 16px auto 8px; width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 3px solid var(--sr-cyan); display: flex; align-items: center; justify-content: center; color: var(--sr-cyan); font-weight: 900; font-size: 30px;">${srInitials(s.name)}</div>
              <!-- Name -->
              <div style="text-align:center; padding: 0 12px;">
                <div style="font-weight: 800; font-size: 16px; line-height: 1.15;">${srEscape(s.name)}</div>
                <div style="font-size: 11px; color: rgba(255,255,255,0.78); margin-top: 2px;">${srEscape(s.grade)}</div>
                <div style="font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 4px; line-height: 1.3;">${srEscape(school.name)}</div>
              </div>
              <!-- Tap zone -->
              <div style="margin: 14px 14px 0; padding: 8px 12px; background: rgba(41,171,226,0.16); border: 1px solid rgba(41,171,226,0.4); border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <svg width="22" height="22" viewBox="0 0 100 100" fill="none" stroke="#29ABE2" stroke-width="8" stroke-linecap="round">
                  <circle cx="22" cy="50" r="6" fill="#29ABE2"/>
                  <path d="M 38 28 Q 56 50 38 72"/>
                  <path d="M 56 16 Q 84 50 56 84"/>
                </svg>
                <span style="color: #29ABE2; font-weight: 800; font-size: 11px; letter-spacing: 0.12em;">TAP HERE</span>
              </div>
              <!-- Footer -->
              <div style="margin-top: auto; padding: 10px 14px; display: flex; justify-content: space-between; font-size: 9px; color: rgba(255,255,255,0.55); letter-spacing: 0.04em;">
                <span>STUDENT ID</span>
                <span class="sr-mono" style="color: var(--sr-cyan); font-weight: 700;">${srEscape(s.qrToken)}</span>
              </div>
            </div>
          </div>

          <!-- ============ BACK ============ -->
          <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="text-text-3" style="font-size: 10px; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 6px;">ດ້ານຫຼັງ</div>
            <!-- Lanyard cord -->
            <svg class="lanyard-cord" width="140" height="34" viewBox="0 0 140 34">
              <path d="M 8 8 Q 70 38 132 8" stroke="#29ABE2" stroke-width="3" fill="none" stroke-linecap="round"/>
              <rect x="62" y="22" width="16" height="10" rx="2" fill="#94A3B8" stroke="#64748B" stroke-width="1"/>
            </svg>
            <!-- Card -->
            <div class="id-card-portrait" style="background: white; box-shadow: 0 14px 30px rgba(14,77,146,0.25); border: 1px solid var(--sr-border);">
              <div class="lanyard-hole" style="background: rgba(0,0,0,0.25);"></div>
              <!-- School header band -->
              <div style="background: linear-gradient(135deg, #0E4D92, #134AA6); color: white; padding: 28px 14px 12px; text-align: center;">
                <div style="font-weight: 800; font-size: 13px; line-height: 1.2;">${srEscape(school.name)}</div>
                <div style="font-size: 10px; color: rgba(255,255,255,0.75); margin-top: 3px;">${srEscape(school.address)}</div>
              </div>
              <!-- QR -->
              <div style="padding: 16px; display: flex; justify-content: center;">
                <div style="background: white; padding: 8px; border-radius: 8px; border: 1px solid #E2E8F0;">
                  <img id="qrImg" alt="QR" width="150" height="150" style="display:block;">
                </div>
              </div>
              <!-- Info -->
              <div style="padding: 0 14px; font-size: 10px; line-height: 1.5;">
                <div style="text-align: center; color: var(--sr-text-2); padding-bottom: 6px; border-bottom: 1px solid var(--sr-border); margin-bottom: 6px;">ແຕະເຄື່ອງອ່ານ ຫຼື ສະແກນ QR</div>
                <div style="display:flex; justify-content: space-between;">
                  <span class="text-text-3">ອອກບັດ</span>
                  <span style="font-weight: 700; color: var(--sr-text);">${srFmtDate(s.cardIssuedAt)}</span>
                </div>
                <div style="display:flex; justify-content: space-between;">
                  <span class="text-text-3">NFC UID</span>
                  <span class="sr-mono" style="font-size: 9px; color: var(--sr-text-2);">${srEscape(s.nfcUid)}</span>
                </div>
              </div>
              <!-- Footer -->
              <div style="margin-top: auto; padding: 10px 12px; background: var(--sr-bg); border-top: 1px dashed #CBD5E1; text-align: center; font-size: 9px; color: var(--sr-text-3);">
                ບັດເສຍ? <strong>+856 84 555 0100</strong> · phetaloun.la
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="sr-modal-foot">
        <button class="sr-btn sr-btn-ghost" data-close>ປິດ</button>
        <button class="sr-btn sr-btn-yellow" onclick="window.print()"><i data-lucide="printer"></i> Print card</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  srIcons();
  overlay.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => overlay.remove()));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  // Render QR
  try {
    const qr = qrcode(0, 'M');
    qr.addData(s.qrToken);
    qr.make();
    const img = overlay.querySelector('#qrImg');
    if (img) img.src = qr.createDataURL(4, 0);
  } catch (e) { console.error(e); }
};

render();

// Auto-open card view if ?card=ID is present (handy for sharing direct previews)
(function () {
  const cardId = new URLSearchParams(location.search).get('card');
  if (cardId && APP_DATA.byId.student[cardId]) {
    setTimeout(() => viewCard(cardId), 50);
  }
})();
</script>
</body>
</html>
