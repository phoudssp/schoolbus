<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeRide — Schools</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sr-sidebar"></aside>
  <div class="app-main">
    <header class="sr-topbar"></header>
    <div class="app-content">

      <div class="sr-page-head">
        <div>
          <div class="sr-breadcrumb"><a href="index.html">Operator</a><i data-lucide="chevron-right"></i><span>Schools</span></div>
          <h1 class="sr-page-title">Schools</h1>
          <p class="sr-page-sub">Schools that subscribe to SafeRide. Manage their addresses, bell times, and contact info.</p>
        </div>
        <button id="addBtn" class="sr-btn sr-btn-primary"><i data-lucide="plus"></i>Add school</button>
      </div>

      <div class="sr-grid sr-cols-3" id="cards"></div>

    </div>
  </div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/ui.js"></script>
<script>
srMount({ role: 'operator', active: 'schools', user: { name: 'Souvanh P.', role: 'Super Admin', initials: 'SP' } });

function render() {
  const cards = document.getElementById('cards');
  cards.innerHTML = APP_DATA.schools.map(s => {
    const sub = APP_DATA.byId.subBySchool[s.id];
    const planName = sub ? APP_DATA.plans[sub.planId].name : '—';
    return `
      <div class="sr-card" style="padding: 0; overflow: hidden;">
        <div style="height: 6px; background: ${s.color};"></div>
        <div style="padding: 18px;">
          <div style="display:flex; align-items: flex-start; justify-content: space-between;">
            <div>
              <div style="font-size: 18px; font-weight: 800; line-height: 1.2;">${srEscape(s.name)}</div>
              <div class="text-text-3" style="font-size: 12px; margin-top: 4px;"><i data-lucide="map-pin" style="width:11px;height:11px; vertical-align:middle;"></i> ${srEscape(s.address)}</div>
            </div>
            <span class="sr-pill ${s.status === 'active' ? 'success' : 'neutral'}"><span class="dot"></span>${s.status}</span>
          </div>
          <div class="sr-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; padding: 12px; background: var(--sr-bg); border-radius: 8px;">
            <div><div class="text-text-3" style="font-size: 10px; text-transform: uppercase;">Students</div><div style="font-weight: 800;">${s.students}</div></div>
            <div><div class="text-text-3" style="font-size: 10px; text-transform: uppercase;">Bell AM</div><div style="font-weight: 800;">${s.bellAm}</div></div>
            <div><div class="text-text-3" style="font-size: 10px; text-transform: uppercase;">Bell PM</div><div style="font-weight: 800;">${s.bellPm}</div></div>
          </div>
          <div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--sr-border);">
            <span class="text-text-3" style="font-size: 12px;"><i data-lucide="package" style="width:12px;height:12px; vertical-align:middle;"></i> ${planName}</span>
            <div>
              <button class="sr-icon-btn" onclick="edit('${s.id}')"><i data-lucide="pencil"></i></button>
              <button class="sr-icon-btn" onclick="del('${s.id}')"><i data-lucide="trash-2"></i></button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
  srIcons();
}

function fields() {
  return [
    { key: 'name', label: 'School name', type: 'text', required: true, placeholder: 'Houayxay International School' },
    { key: 'nameLo', label: 'Lao name', type: 'text', placeholder: 'ໂຮງຮຽນສາກົນຫ້ວຍຊາຍ' },
    { key: 'shortName', label: 'Short name', type: 'text', required: true, placeholder: 'HIS' },
    { key: 'address', label: 'Address', type: 'text', required: true },
    { key: 'bellAm', label: 'AM bell', type: 'time', required: true, default: '07:30' },
    { key: 'bellPm', label: 'PM bell', type: 'time', required: true, default: '14:30' },
    { key: 'students', label: 'Number of students', type: 'number', required: true, default: 100 },
    { key: 'color', label: 'Map color', type: 'color', default: '#2563EB' },
    { key: 'status', label: 'Status', type: 'select', default: 'active', options: ['active', 'inactive'] }
  ];
}
document.getElementById('addBtn').addEventListener('click', () => srModal({
  title: 'Add school', fields: fields(),
  onSave: data => {
    const id = (data.shortName || 'sch').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 4);
    const newS = { id, ...data, coords: APP_DATA.operator.center };
    APP_DATA.schools.push(newS);
    APP_DATA.byId.school[id] = newS;
    srToast('✓ School added'); render();
  }
}));
window.edit = id => {
  const s = APP_DATA.byId.school[id];
  srModal({ title: 'Edit ' + s.name, fields: fields(), values: s,
    onSave: data => { Object.assign(s, data); srToast('✓ Saved'); render(); } });
};
window.del = id => srConfirm({ title: 'Delete school?', message: 'Linked students and routes will be unaffected but show "removed school".', danger: true,
  onYes: () => { APP_DATA.schools = APP_DATA.schools.filter(x => x.id !== id); delete APP_DATA.byId.school[id]; srToast('✓ Deleted'); render(); } });

render();
</script>
</body>
</html>
