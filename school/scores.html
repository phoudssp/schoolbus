<!doctype html>
<html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phetaloun School — Score Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="../shared/style.css">
</head><body>
<div class="app-shell">
  <aside class="sr-sidebar"></aside>
  <div class="app-main">
    <header class="sr-topbar"></header>
    <div class="app-content">
      <div class="sr-page-head">
        <div>
          <div class="sr-breadcrumb"><a href="index.html">ໂຮງຮຽນ</a><i data-lucide="chevron-right"></i><span>ຄະແນນ</span></div>
          <h1 class="sr-page-title">ການຈັດການຄະແນນ</h1>
          <p class="sr-page-sub">ໃສ່ຄະແນນສຳລັບແຕ່ລະນັກຮຽນ × ວິຊາ. ຜູ້ປົກຄອງເຫັນທັນທີໃນແອັບ.</p>
        </div>
        <button id="addBtn" class="sr-btn sr-btn-primary"><i data-lucide="award"></i>ໃສ່ຄະແນນ</button>
      </div>

      <div class="sr-grid sr-cols-12" style="margin-bottom: 18px;">
        <div class="sr-card" style="grid-column: span 8;">
          <div class="sr-card-head">
            <h3 class="sr-card-title">ກັ່ນຕອງຄະແນນ</h3>
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="filterStu" class="sr-select" style="max-width: 220px;"><option value="">ນັກຮຽນທັງໝົດ</option></select>
            <select id="filterSubj" class="sr-select" style="max-width: 200px;"><option value="">ວິຊາທັງໝົດ</option></select>
            <select id="filterMonth" class="sr-select" style="max-width: 160px;">
              <option value="">ເດືອນທັງໝົດ</option><option value="2026-05">May 2026</option><option value="2026-04">April 2026</option><option value="2026-03">March 2026</option>
            </select>
          </div>
        </div>
        <div class="sr-card" style="grid-column: span 4;">
          <div class="sr-card-head"><h3 class="sr-card-title">ຄະແນນສະເລ່ຍຂອງໂຮງຮຽນ</h3></div>
          <div style="position: relative; height: 140px;"><canvas id="avgChart"></canvas></div>
        </div>
      </div>

      <div class="sr-table-wrap"><table class="sr-table">
        <thead><tr><th>ນັກຮຽນ</th><th>ວິຊາ</th><th>ປະເພດ</th><th>ຄະແນນ</th><th>ວັນທີ</th><th>ຄູ</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </div>
</div>
<script src="../shared/data.js"></script>
<script src="../shared/ui.js"></script>
<script>
const SCHOOL_ID = 'vis';
srMount({ role: 'school', active: 'scores', user: { name: 'Bounnyong S.', role: 'Principal · HIS', initials: 'BS' } });

const myStudents = APP_DATA.students.filter(s => s.schoolId === SCHOOL_ID);
const myScores = () => APP_DATA.scores.filter(s => s.schoolId === SCHOOL_ID);

const fStu = document.getElementById('filterStu');
myStudents.forEach(s => fStu.insertAdjacentHTML('beforeend', `<option value="${s.id}">${srEscape(s.name)}</option>`));
const fSubj = document.getElementById('filterSubj');
APP_DATA.subjects.forEach(s => fSubj.insertAdjacentHTML('beforeend', `<option value="${s.id}">${srEscape(s.name)}</option>`));
fStu.addEventListener('change', render);
fSubj.addEventListener('change', render);
document.getElementById('filterMonth').addEventListener('change', render);

function render() {
  const fs = fStu.value, fb = fSubj.value, fm = document.getElementById('filterMonth').value;
  const list = myScores().filter(s => (!fs || s.studentId === fs) && (!fb || s.subject === fb) && (!fm || s.date.startsWith(fm)));
  const tbody = document.getElementById('rows');
  if (!list.length) { tbody.innerHTML = `<tr><td colspan="7"><div class="sr-empty"><i data-lucide="award"></i><div>No scores match your filters</div></div></td></tr>`; srIcons(); return; }
  tbody.innerHTML = list.sort((a, b) => b.date.localeCompare(a.date)).map(s => {
    const stu = APP_DATA.byId.student[s.studentId];
    const subj = APP_DATA.byId.subject[s.subject];
    const grade = s.score >= 85 ? 'success' : s.score >= 70 ? 'info' : s.score >= 50 ? 'warn' : 'danger';
    const letter = s.score >= 85 ? 'A' : s.score >= 70 ? 'B' : s.score >= 60 ? 'C' : s.score >= 50 ? 'D' : 'F';
    return `
      <tr>
        <td><div style="display:flex; gap:10px; align-items:center;">
          <div class="sr-avatar" style="background: rgba(85,112,241,0.12); color: var(--sr-blue);">${srInitials(stu.name)}</div>
          <div><div style="font-weight:700;">${srEscape(stu.name)}</div><div class="text-text-3" style="font-size:11px;">${srEscape(stu.grade)}</div></div>
        </div></td>
        <td><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px;"><i data-lucide="${subj.icon}" style="width:14px;height:14px;"></i> ${srEscape(subj.name)}</span></td>
        <td><span class="sr-pill neutral">${srEscape(s.assessmentType)}</span></td>
        <td><div style="display: flex; align-items: center; gap: 8px;"><div style="font-size: 18px; font-weight: 800;">${s.score}<span class="text-text-3" style="font-size:12px; font-weight: 500;">/${s.max}</span></div><span class="sr-pill ${grade}">${letter}</span></div></td>
        <td class="text-text-3" style="font-size: 12px;">${srFmtDate(s.date)}</td>
        <td class="text-text-2" style="font-size: 12px;">${srEscape(s.teacher)}</td>
        <td style="text-align:right;">
          <button class="sr-icon-btn" onclick="del('${s.id}')"><i data-lucide="trash-2"></i></button>
        </td>
      </tr>
    `;
  }).join('');
  srIcons();

  // Update average chart
  if (chart) chart.destroy();
  const data = APP_DATA.subjects.map(sub => {
    const arr = myScores().filter(s => s.subject === sub.id);
    return arr.length ? Math.round(arr.reduce((a,b) => a+b.score, 0) / arr.length) : 0;
  });
  chart = new Chart(document.getElementById('avgChart'), {
    type: 'doughnut',
    data: { labels: APP_DATA.subjects.map(s => s.name), datasets: [{ data, backgroundColor: ['#5570F1','#10B981','#FFD60A','#F59E0B','#8B5CF6','#06B6D4','#F43F5E'], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}
let chart = null;

document.getElementById('addBtn').addEventListener('click', () => {
  // Pull dropdown options from the live CRUD data — Subjects / Assessment Types / Teachers
  const subjOpts    = APP_DATA.subjects.map(s => ({ value: s.id, label: s.name + (s.nameLo ? ' · ' + s.nameLo : '') }));
  const typeOpts    = APP_DATA.assessmentTypes.map(t => ({ value: t.name, label: t.name + (t.nameLo ? ' · ' + t.nameLo : '') + ' (' + (t.weight || 0) + '%)' }));
  const teacherOpts = APP_DATA.teachers.filter(t => t.schoolId === SCHOOL_ID).map(t => ({
    value: t.id,
    label: t.name + ' — ' + (t.subjects || []).map(sid => (APP_DATA.byId.subject[sid] || {}).name).filter(Boolean).join(', ')
  }));

  if (subjOpts.length === 0)    { srToast('ກະລຸນາເພີ່ມວິຊາກ່ອນ');           setTimeout(() => location = 'subjects.html', 800); return; }
  if (typeOpts.length === 0)    { srToast('ກະລຸນາເພີ່ມປະເພດການປະເມີນກ່ອນ'); setTimeout(() => location = 'assessment-types.html', 800); return; }
  if (teacherOpts.length === 0) { srToast('ກະລຸນາເພີ່ມຄູກ່ອນ');               setTimeout(() => location = 'teachers.html', 800); return; }

  srModal({
    title: 'ໃສ່ຄະແນນ',
    fields: [
      { key: 'studentId',      label: 'ນັກຮຽນ',                   type: 'select', required: true, options: myStudents.map(s => ({ value: s.id, label: s.name + ' · ' + s.grade })) },
      { key: 'subject',        label: 'ວິຊາ',                      type: 'select', required: true, options: subjOpts,    hint: 'ຈັດການລາຍຊື່ທີ່ "ວິຊາຮຽນ"' },
      { key: 'assessmentType', label: 'ປະເພດ',                     type: 'select', required: true, options: typeOpts,    hint: 'ຈັດການລາຍຊື່ທີ່ "ປະເພດການປະເມີນ"' },
      { key: 'teacherId',      label: 'ຄູ',                         type: 'select', required: true, options: teacherOpts, hint: 'ຈັດການລາຍຊື່ທີ່ "ຄູອາຈານ"' },
      { key: 'score',          label: 'ຄະແນນ (ເຕັມ 100)',        type: 'number', required: true, default: 80 },
      { key: 'date',           label: 'ວັນທີ',                      type: 'date',   required: true, default: '2026-05-09' },
      { key: 'comment',        label: 'ໝາຍເຫດ (ບໍ່ບັງຄັບ)',     type: 'textarea' }
    ],
    onSave: data => {
      const subj = APP_DATA.byId.subject[data.subject];
      const teacherObj = APP_DATA.byId.teacher[data.teacherId];
      const newS = {
        id: 'SC-' + (APP_DATA.scores.length + 1).toString().padStart(4, '0'),
        schoolId: SCHOOL_ID, max: 100,
        subjectName: subj.name,
        teacher: teacherObj ? teacherObj.name : '—',
        ...data
      };
      APP_DATA.scores.push(newS);
      srToast('✓ ບັນທຶກຄະແນນແລ້ວ — ແຈ້ງເຕືອນຜູ້ປົກຄອງແລ້ວ');
      render();
    }
  });
});
window.del = id => srConfirm({ title: 'Delete score?', message: 'The parent will see the deletion.', danger: true,
  onYes: () => { APP_DATA.scores = APP_DATA.scores.filter(x => x.id !== id); srToast('✓ ລຶບແລ້ວ'); render(); }});

render();
</script></body></html>
