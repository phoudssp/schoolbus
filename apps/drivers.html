<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeRide — Drivers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">

<header class="sr-gradient text-white sticky top-0 z-30">
  <div class="px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="../index.html" class="sr-logo text-white"><span class="sr-logo-mark">S</span><span data-i18n="brand">SafeRide</span></a>
      <nav id="topNav" class="hidden md:flex items-center gap-1 text-sm"></nav>
    </div>
    <button onclick="toggleLang()" class="sr-btn sr-btn-yellow text-sm px-3 py-1.5"><span data-i18n="languageSwitch">ລາວ</span></button>
  </div>
</header>

<main class="px-5 py-5 max-w-7xl mx-auto">

  <div class="text-sm text-slate-500 mb-2">
    <a href="manage.html" class="hover:underline" data-i18n="manage.title">Manage</a>
    <span class="mx-1">›</span>
    <span data-i18n="driversPage.title">Drivers</span>
  </div>

  <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
    <div>
      <h1 class="text-2xl font-extrabold sr-brand-text" data-i18n="driversPage.title">Drivers</h1>
      <p class="text-sm text-slate-500" data-i18n="driversPage.subtitle">Driver roster, licenses, and assignments.</p>
    </div>
    <div class="flex items-center gap-2">
      <input id="search" type="text" data-i18n-placeholder="crud.search" placeholder="Search…" class="border border-slate-300 rounded-md px-3 py-1.5 text-sm w-56">
      <button id="addBtn" class="sr-btn sr-btn-primary text-sm">➕ <span data-i18n="driversPage.addDriver">Add driver</span></button>
    </div>
  </div>

  <div class="sr-card overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="text-left px-4 py-2.5" data-i18n="driversPage.driverName">Name</th>
          <th class="text-left px-4 py-2.5" data-i18n="driversPage.phone">Phone</th>
          <th class="text-left px-4 py-2.5" data-i18n="driversPage.license">License #</th>
          <th class="text-left px-4 py-2.5" data-i18n="driversPage.licenseExpiry">Expiry</th>
          <th class="text-left px-4 py-2.5" data-i18n="driversPage.assignedBus">Assigned bus</th>
          <th class="text-left px-4 py-2.5" data-i18n="billing.status">Status</th>
          <th class="text-right px-4 py-2.5"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

</main>

<script src="../shared/i18n.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/crud.js"></script>
<script>
document.getElementById('topNav').innerHTML = srOperatorNav('manage');
document.querySelectorAll('#topNav [data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));

const STATUS_OPTIONS = [
  { value: 'active',   label: 'Active' },
  { value: 'on_leave', label: 'On leave' },
  { value: 'inactive', label: 'Inactive' }
];

function statusPill(s) {
  const cls = s === 'active' ? 'on_time' : s === 'on_leave' ? 'at_stop' : 'idle';
  const label = s === 'active' ? t('billing.active') : s === 'on_leave' ? t('driversPage.onLeave') : t('driversPage.inactive');
  return `<span class="sr-pill ${cls}"><span class="dot"></span>${label}</span>`;
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const tbody = document.getElementById('rows');
  const list = APP_DATA.drivers.filter(d =>
    !q || d.name.toLowerCase().includes(q) || (d.licenseNo || '').toLowerCase().includes(q) || (d.phone || '').includes(q)
  );
  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-6 text-center text-sm text-slate-400">${t('crud.none')}</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(d => {
    const initials = d.name.split(' ').map(p => p[0]).slice(0, 2).join('');
    return `
      <tr class="border-t border-slate-100 hover:bg-slate-50">
        <td class="px-4 py-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center font-bold text-slate-600">${initials}</div>
            <div>
              <div class="font-bold sr-brand-text">${srEscape(d.name)}</div>
              <div class="text-xs text-slate-500">${d.id} · hired ${d.hiredAt}</div>
            </div>
          </div>
        </td>
        <td class="px-4 py-3 font-mono text-xs text-slate-600">${srEscape(d.phone || '')}</td>
        <td class="px-4 py-3 font-mono text-xs">${srEscape(d.licenseNo || '')}</td>
        <td class="px-4 py-3 text-slate-600">${d.licenseExpiry || '—'}</td>
        <td class="px-4 py-3 font-bold">${d.assignedBusId || '<span class="text-slate-400 font-normal">—</span>'}</td>
        <td class="px-4 py-3">${statusPill(d.status)}</td>
        <td class="px-4 py-3 text-right whitespace-nowrap">
          <button onclick="editDriver('${d.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2">${t('crud.edit')}</button>
          <button onclick="deleteDriver('${d.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2 text-red-600">${t('crud.delete')}</button>
        </td>
      </tr>
    `;
  }).join('');
}

function fields() {
  const busOptions = [{ value: '', label: '— ' + t('crud.none') + ' —' }]
    .concat(APP_DATA.buses.map(b => ({ value: b.id, label: `${b.id} (${b.plate})` })));
  return [
    { key: 'name',         label: t('driversPage.driverName'),     type: 'text', required: true, placeholder: 'Bounmy Phimmasone' },
    { key: 'phone',        label: t('driversPage.phone'),          type: 'tel', placeholder: '+856 20 5555 1234' },
    { key: 'licenseNo',    label: t('driversPage.license'),        type: 'text', required: true, placeholder: 'LD-2024-0001' },
    { key: 'licenseExpiry', label: t('driversPage.licenseExpiry'), type: 'date', required: true, default: '2027-12-31' },
    { key: 'hiredAt',      label: t('driversPage.hiredAt'),        type: 'date', default: new Date().toISOString().slice(0, 10) },
    { key: 'assignedBusId', label: t('driversPage.assignedBus'),   type: 'select', options: busOptions },
    { key: 'status',       label: t('billing.status'),             type: 'select', options: STATUS_OPTIONS, default: 'active' }
  ];
}

document.getElementById('addBtn').addEventListener('click', () => {
  srModal({
    title: t('driversPage.addDriver'),
    fields: fields(),
    onSave: data => {
      const id = srNewId('D', APP_DATA.drivers);
      const driver = { id, avatar: '🧑‍✈️', ...data };
      APP_DATA.drivers.push(driver);
      APP_DATA.byId.driver[id] = driver;
      srToast('✓ ' + t('crud.created'));
      render();
    }
  });
});

window.editDriver = function(id) {
  const d = APP_DATA.byId.driver[id];
  srModal({
    title: t('crud.edit') + ' — ' + d.name,
    fields: fields(),
    values: d,
    onSave: data => {
      Object.assign(d, data);
      srToast('✓ ' + t('crud.saved'));
      render();
    }
  });
};

window.deleteDriver = function(id) {
  const d = APP_DATA.byId.driver[id];
  srConfirm({
    title: t('crud.delete') + ' — ' + d.name,
    message: t('crud.confirmDelete'),
    danger: true,
    onYes: () => {
      const idx = APP_DATA.drivers.findIndex(x => x.id === id);
      if (idx >= 0) APP_DATA.drivers.splice(idx, 1);
      delete APP_DATA.byId.driver[id];
      srToast('✓ ' + t('crud.deleted'));
      render();
    }
  });
};

document.getElementById('search').addEventListener('input', render);
render();
window.addEventListener('langchange', render);
</script>
</body>
</html>
