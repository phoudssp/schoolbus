<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeRide — School Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">

<!-- Top bar -->
<header class="sr-gradient text-white sticky top-0 z-30">
  <div class="px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="../index.html" class="sr-logo text-white">
        <span class="sr-logo-mark">S</span>
        <span data-i18n="brand">SafeRide</span>
      </a>
      <span class="hidden sm:inline text-slate-300">|</span>
      <span class="hidden sm:inline text-sm text-slate-200" data-i18n="schoolApp">School Dashboard</span>
    </div>
    <div class="flex items-center gap-3">
      <select id="schoolPicker" class="bg-white/10 border border-white/20 text-white text-sm rounded-md px-3 py-1.5"></select>
      <button onclick="toggleLang()" class="sr-btn sr-btn-yellow text-sm px-3 py-1.5">
        <span data-i18n="languageSwitch">ລາວ</span>
      </button>
    </div>
  </div>
</header>

<!-- School header card -->
<section class="px-5 pt-4">
  <div class="max-w-6xl mx-auto sr-card-elev p-5" id="schoolHeader"></div>
</section>

<!-- Stats strip -->
<section class="px-5 pt-4">
  <div class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-3">
    <div class="sr-card p-4">
      <div class="text-xs text-slate-500" data-i18n="expected">Expected</div>
      <div class="text-2xl font-extrabold sr-brand-text" id="stat-expected">—</div>
    </div>
    <div class="sr-card p-4">
      <div class="text-xs text-slate-500" data-i18n="presentBus">Present (bus)</div>
      <div class="text-2xl font-extrabold text-emerald-600" id="stat-present">—</div>
    </div>
    <div class="sr-card p-4">
      <div class="text-xs text-slate-500" data-i18n="absent">Absent</div>
      <div class="text-2xl font-extrabold text-slate-500" id="stat-absent">—</div>
    </div>
    <div class="sr-card p-4">
      <div class="text-xs text-slate-500" data-i18n="discrepancies">Discrepancies</div>
      <div class="text-2xl font-extrabold text-amber-600" id="stat-disc">—</div>
    </div>
  </div>
</section>

<!-- Main grid -->
<main class="px-5 py-4 max-w-6xl mx-auto grid grid-cols-12 gap-4">
  <!-- Today's buses -->
  <section class="col-span-12 md:col-span-6 sr-card p-4">
    <h2 class="font-bold sr-brand-text mb-3" data-i18n="todayBuses">Today's incoming buses</h2>
    <div id="busesIn" class="space-y-2"></div>
  </section>

  <!-- Student lookup -->
  <section class="col-span-12 md:col-span-6 sr-card p-4">
    <h2 class="font-bold sr-brand-text mb-3" data-i18n="studentLookup">Student lookup</h2>
    <input id="studentSearch" type="text" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm mb-3"
           data-i18n-placeholder="searchStudents" placeholder="Search students…">
    <div id="studentList" class="space-y-1 sr-scroll" style="max-height: 360px; overflow:auto;"></div>
  </section>

  <!-- Discrepancies -->
  <section class="col-span-12 sr-card p-4">
    <h2 class="font-bold sr-brand-text mb-3" data-i18n="discrepancies">Discrepancies</h2>
    <div id="discList" class="space-y-2"></div>
  </section>

  <!-- Incidents -->
  <section class="col-span-12 sr-card p-4">
    <h2 class="font-bold sr-brand-text mb-3" data-i18n="incidents">Incidents</h2>
    <div id="incList" class="text-sm text-slate-500" data-i18n="noIncidents">No incidents today</div>
  </section>
</main>

<script src="../shared/i18n.js"></script>
<script src="../shared/data.js"></script>
<script>
let currentSchoolId = 'vis';

// School picker
const sp = document.getElementById('schoolPicker');
APP_DATA.schools.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.id;
  opt.textContent = s.name;
  if (s.id === currentSchoolId) opt.selected = true;
  sp.appendChild(opt);
});
sp.addEventListener('change', () => { currentSchoolId = sp.value; renderAll(); });

// Helpers
function studentsAtSchool(schoolId) {
  return APP_DATA.students.filter(s => s.schoolId === schoolId);
}

function busesForSchool(schoolId) {
  // Find all routes that include a run for this school
  const out = [];
  APP_DATA.routes.forEach(r => {
    r.runs.forEach(run => {
      if (run.schoolId === schoolId) {
        out.push({ route: r, run });
      }
    });
  });
  return out;
}

// Render school header card
function renderSchoolHeader() {
  const s = APP_DATA.byId.school[currentSchoolId];
  document.getElementById('schoolHeader').innerHTML = `
    <div class="flex items-center justify-between">
      <div>
        <div class="text-xs text-slate-500 uppercase tracking-wide">${t('schools')}</div>
        <div class="text-2xl font-extrabold sr-brand-text" style="color:${s.color}">${APP_LANG === 'lo' ? s.nameLo : s.name}</div>
        <div class="text-sm text-slate-500">${s.address} · ${t('today')} ${fmtTime(APP_NOW)}</div>
      </div>
      <div class="text-right">
        <div class="text-xs text-slate-500">Bell</div>
        <div class="font-bold">${s.bellAm} / ${s.bellPm}</div>
        <div class="text-xs text-slate-500 mt-1">${s.students} ${t('students').toLowerCase()}</div>
      </div>
    </div>
  `;
}

// Stats
function renderStats() {
  const buses = busesForSchool(currentSchoolId);
  const expected = buses.reduce((a, x) => a + x.run.stops.reduce((b, s) => b + s.studentIds.length, 0), 0);
  const events = buses.flatMap(x => eventsForRun(x.run.id));
  const present = new Set(events.filter(e => e.type === 'BOARD').map(e => e.studentId)).size;
  const absent = expected - present;
  // Synthetic discrepancy count (for demo)
  const disc = currentSchoolId === 'vis' ? 1 : 0;

  document.getElementById('stat-expected').textContent = expected;
  document.getElementById('stat-present').textContent = present;
  document.getElementById('stat-absent').textContent = absent;
  document.getElementById('stat-disc').textContent = disc;
}

// Today's incoming buses
function renderBusesIn() {
  const wrap = document.getElementById('busesIn');
  const buses = busesForSchool(currentSchoolId);
  wrap.innerHTML = '';
  buses.forEach(({ route, run }) => {
    const lp = APP_DATA.livePositions[route.busId];
    const driver = APP_DATA.byId.driver[route.driverId];
    const expected = run.stops.reduce((a, s) => a + s.studentIds.length, 0);
    const scanned = eventsForRun(run.id).filter(e => e.type === 'BOARD').length;
    const isAtSchool = lp && lp.nextStopId && APP_DATA.byId.stop[lp.nextStopId]?.isSchool === currentSchoolId;
    const arrived = scanned === expected;

    const card = document.createElement('div');
    card.className = 'p-3 rounded-lg border border-slate-200';
    card.innerHTML = `
      <div class="flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-bold sr-brand-text">${route.busId}</span>
            <span class="text-xs text-slate-500">${driver.name}</span>
          </div>
          <div class="font-mono text-xs text-slate-500 mt-0.5">${run.id}</div>
        </div>
        <div class="text-right">
          ${arrived
            ? `<span class="sr-pill on_time"><span class="dot"></span>${t('arrived')}</span>`
            : isAtSchool
              ? `<span class="sr-pill at_stop"><span class="dot"></span>${t('atStop')}</span>`
              : lp && lp.status !== 'idle'
                ? `<span class="sr-pill in_transit"><span class="dot"></span>${t('inTransit')}</span>`
                : `<span class="sr-pill idle"><span class="dot"></span>${t('notStarted')}</span>`}
          ${lp && lp.etaMin != null && !arrived ? `<div class="text-xs text-slate-500 mt-1">${t('eta')}: ${lp.etaMin}m</div>` : ''}
        </div>
      </div>
      <div class="mt-3 flex items-center gap-2">
        <div class="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div class="bg-emerald-500 h-full" style="width:${expected ? (scanned / expected * 100) : 0}%"></div>
        </div>
        <div class="text-xs font-bold tabular-nums">${scanned}/${expected}</div>
      </div>
    `;
    wrap.appendChild(card);
  });
}

// Student list
function renderStudentList(filter = '') {
  const wrap = document.getElementById('studentList');
  const students = studentsAtSchool(currentSchoolId);
  const f = filter.trim().toLowerCase();
  const items = students.filter(s => !f || s.name.toLowerCase().includes(f) || s.id.toLowerCase().includes(f));

  if (items.length === 0) {
    wrap.innerHTML = `<div class="text-sm text-slate-400 py-2 text-center">—</div>`;
    return;
  }

  wrap.innerHTML = items.map(s => {
    const evs = eventsForStudent(s.id);
    const onBus = evs.some(e => e.type === 'BOARD');
    const guardian = APP_DATA.byId.guardian[s.guardianId];
    const stop = APP_DATA.byId.stop[s.stopId];
    return `
      <div class="flex items-center justify-between py-2 px-2 hover:bg-slate-50 rounded">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center font-bold text-slate-600 text-sm">
            ${s.name.split(' ').map(p => p[0]).slice(0,2).join('')}
          </div>
          <div class="min-w-0">
            <div class="font-semibold text-sm truncate">${s.name}</div>
            <div class="text-xs text-slate-500 truncate">${s.grade} · ${guardian.name} · ${stop.name}</div>
          </div>
        </div>
        ${onBus
          ? `<span class="sr-pill on_time"><span class="dot"></span>${t('boarded')}</span>`
          : `<span class="sr-pill idle"><span class="dot"></span>${t('waitingAtHome')}</span>`}
      </div>
    `;
  }).join('');
}

document.getElementById('studentSearch').addEventListener('input', e => {
  renderStudentList(e.target.value);
});

// Discrepancies — synthetic for demo
function renderDiscrepancies() {
  const wrap = document.getElementById('discList');
  if (currentSchoolId !== 'vis') {
    wrap.innerHTML = `<div class="text-sm text-slate-400">—</div>`;
    return;
  }
  // Sample: Tom Phommachanh scanned onto bus but classroom marked absent
  wrap.innerHTML = `
    <div class="sr-notif warning">
      <div class="flex items-start justify-between">
        <div>
          <div class="font-semibold text-sm">⚠️ Tom Phommachanh (S-1003)</div>
          <div class="text-xs text-slate-600 mt-0.5">${t('busAttendance')}: ✓ ${t('scanned')} 06:30 · ${t('classroomAttendance')}: ${t('absent')}</div>
        </div>
        <button class="sr-btn sr-btn-ghost text-xs py-1 px-2">Investigate</button>
      </div>
    </div>
  `;
}

function renderAll() {
  renderSchoolHeader();
  renderStats();
  renderBusesIn();
  renderStudentList(document.getElementById('studentSearch').value);
  renderDiscrepancies();
}

renderAll();

window.addEventListener('langchange', renderAll);
</script>

</body>
</html>
