<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeRide — Buses</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">

<header class="sr-gradient text-white sticky top-0 z-30">
  <div class="px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="../index.html" class="sr-logo text-white"><span class="sr-logo-mark">S</span><span data-i18n="brand">SafeRide</span></a>
      <nav id="topNav" class="hidden md:flex items-center gap-1 text-sm"></nav>
    </div>
    <button onclick="toggleLang()" class="sr-btn sr-btn-yellow text-sm px-3 py-1.5"><span data-i18n="languageSwitch">ລາວ</span></button>
  </div>
</header>

<main class="px-5 py-5 max-w-7xl mx-auto">

  <div class="text-sm text-slate-500 mb-2">
    <a href="manage.html" class="hover:underline" data-i18n="manage.title">Manage</a>
    <span class="mx-1">›</span>
    <span data-i18n="busesPage.title">Buses</span>
  </div>

  <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
    <div>
      <h1 class="text-2xl font-extrabold sr-brand-text" data-i18n="busesPage.title">Buses</h1>
      <p class="text-sm text-slate-500" data-i18n="busesPage.subtitle">Your fleet — plates, capacities, status.</p>
    </div>
    <div class="flex items-center gap-2">
      <input id="search" type="text" data-i18n-placeholder="crud.search" placeholder="Search…" class="border border-slate-300 rounded-md px-3 py-1.5 text-sm w-56">
      <button id="addBtn" class="sr-btn sr-btn-primary text-sm">➕ <span data-i18n="busesPage.addBus">Add bus</span></button>
    </div>
  </div>

  <div class="sr-card overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="text-left px-4 py-2.5" data-i18n="busesPage.busId">Bus ID</th>
          <th class="text-left px-4 py-2.5" data-i18n="busesPage.plate">Plate</th>
          <th class="text-right px-4 py-2.5" data-i18n="busesPage.capacity">Capacity</th>
          <th class="text-left px-4 py-2.5" data-i18n="busesPage.year">Year</th>
          <th class="text-left px-4 py-2.5" data-i18n="busesPage.lastService">Last service</th>
          <th class="text-left px-4 py-2.5" data-i18n="billing.status">Status</th>
          <th class="text-left px-4 py-2.5" data-i18n="busesPage.notes">Notes</th>
          <th class="text-right px-4 py-2.5"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

</main>

<script src="../shared/i18n.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/crud.js"></script>
<script>
document.getElementById('topNav').innerHTML = srOperatorNav('manage');
document.querySelectorAll('#topNav [data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));

const STATUS_OPTIONS = [
  { value: 'active', label: 'Active' },
  { value: 'idle',   label: 'Idle / spare' },
  { value: 'maintenance', label: 'In maintenance' },
  { value: 'decommissioned', label: 'Decommissioned' }
];

function statusPill(status) {
  const cls = status === 'active' ? 'on_time'
            : status === 'idle' ? 'idle'
            : status === 'maintenance' ? 'at_stop'
            : 'late';
  return `<span class="sr-pill ${cls}"><span class="dot"></span>${status}</span>`;
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const tbody = document.getElementById('rows');
  const list = APP_DATA.buses.filter(b =>
    !q || b.id.toLowerCase().includes(q) || b.plate.toLowerCase().includes(q) || (b.notes || '').toLowerCase().includes(q)
  );
  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="px-4 py-6 text-center text-sm text-slate-400">${t('crud.none')}</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(b => `
    <tr class="border-t border-slate-100 hover:bg-slate-50">
      <td class="px-4 py-3 font-bold sr-brand-text">${srEscape(b.id)}</td>
      <td class="px-4 py-3 font-mono text-xs">${srEscape(b.plate)}</td>
      <td class="px-4 py-3 text-right tabular-nums">${b.capacity}</td>
      <td class="px-4 py-3 text-slate-600">${b.year || '—'}</td>
      <td class="px-4 py-3 text-slate-600">${b.lastService || '—'}</td>
      <td class="px-4 py-3">${statusPill(b.status)}</td>
      <td class="px-4 py-3 text-slate-500 text-xs max-w-xs truncate">${srEscape(b.notes || '')}</td>
      <td class="px-4 py-3 text-right whitespace-nowrap">
        <button onclick="editBus('${b.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2">${t('crud.edit')}</button>
        <button onclick="deleteBus('${b.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2 text-red-600">${t('crud.delete')}</button>
      </td>
    </tr>
  `).join('');
}

function fields() {
  return [
    { key: 'id',          label: t('busesPage.busId'),       type: 'text', required: true, placeholder: 'B-107' },
    { key: 'plate',       label: t('busesPage.plate'),       type: 'text', required: true, placeholder: 'ດທ-3000' },
    { key: 'capacity',    label: t('busesPage.capacity'),    type: 'number', required: true, default: 40 },
    { key: 'year',        label: t('busesPage.year'),        type: 'number', default: 2024 },
    { key: 'lastService', label: t('busesPage.lastService'), type: 'date',   default: '2026-04-15' },
    { key: 'status',      label: t('billing.status'),        type: 'select', options: STATUS_OPTIONS, default: 'active' },
    { key: 'notes',       label: t('busesPage.notes'),       type: 'textarea' }
  ];
}

document.getElementById('addBtn').addEventListener('click', () => {
  srModal({
    title: t('busesPage.addBus'),
    fields: fields(),
    onSave: data => {
      if (APP_DATA.byId.bus[data.id]) { alert('Bus ID exists'); return false; }
      APP_DATA.buses.push({ ...data });
      APP_DATA.byId.bus[data.id] = APP_DATA.buses[APP_DATA.buses.length - 1];
      srToast('✓ ' + t('crud.created'));
      render();
    }
  });
});

window.editBus = function(id) {
  const b = APP_DATA.byId.bus[id];
  srModal({
    title: t('crud.edit') + ' — ' + b.id,
    fields: fields().map(f => f.key === 'id' ? { ...f, readonly: true } : f),
    values: b,
    onSave: data => {
      Object.assign(b, data);
      srToast('✓ ' + t('crud.saved'));
      render();
    }
  });
};

window.deleteBus = function(id) {
  srConfirm({
    title: t('crud.delete') + ' — ' + id,
    message: t('crud.confirmDelete'),
    danger: true,
    onYes: () => {
      const idx = APP_DATA.buses.findIndex(x => x.id === id);
      if (idx >= 0) APP_DATA.buses.splice(idx, 1);
      delete APP_DATA.byId.bus[id];
      srToast('✓ ' + t('crud.deleted'));
      render();
    }
  });
};

document.getElementById('search').addEventListener('input', render);
render();
window.addEventListener('langchange', render);
</script>
</body>
</html>
