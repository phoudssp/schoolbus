<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeRide — Schools</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">

<header class="sr-gradient text-white sticky top-0 z-30">
  <div class="px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="../index.html" class="sr-logo text-white"><span class="sr-logo-mark">S</span><span data-i18n="brand">SafeRide</span></a>
      <nav id="topNav" class="hidden md:flex items-center gap-1 text-sm"></nav>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="toggleLang()" class="sr-btn sr-btn-yellow text-sm px-3 py-1.5"><span data-i18n="languageSwitch">ລາວ</span></button>
    </div>
  </div>
</header>

<main class="px-5 py-5 max-w-7xl mx-auto">

  <!-- Breadcrumb -->
  <div class="text-sm text-slate-500 mb-2">
    <a href="manage.html" class="hover:underline" data-i18n="manage.title">Manage</a>
    <span class="mx-1">›</span>
    <span data-i18n="schoolsPage.title">Schools</span>
  </div>

  <!-- Header -->
  <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
    <div>
      <h1 class="text-2xl font-extrabold sr-brand-text" data-i18n="schoolsPage.title">Schools</h1>
      <p class="text-sm text-slate-500" data-i18n="schoolsPage.subtitle">School customers served by your fleet.</p>
    </div>
    <div class="flex items-center gap-2">
      <input id="search" type="text" data-i18n-placeholder="crud.search" placeholder="Search…" class="border border-slate-300 rounded-md px-3 py-1.5 text-sm w-56">
      <button id="addBtn" class="sr-btn sr-btn-primary text-sm">➕ <span data-i18n="schoolsPage.addSchool">Add school</span></button>
    </div>
  </div>

  <!-- Table -->
  <div class="sr-card overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="text-left px-4 py-2.5" data-i18n="schoolsPage.name">School name</th>
          <th class="text-left px-4 py-2.5" data-i18n="schoolsPage.address">Address</th>
          <th class="text-left px-4 py-2.5">Bell</th>
          <th class="text-right px-4 py-2.5" data-i18n="schoolsPage.students">Students</th>
          <th class="text-left px-4 py-2.5" data-i18n="billing.status">Status</th>
          <th class="text-right px-4 py-2.5"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

</main>

<script src="../shared/i18n.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/crud.js"></script>
<script>
document.getElementById('topNav').innerHTML = srOperatorNav('manage');
document.querySelectorAll('#topNav [data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));

const COLOR_OPTIONS = [
  { value: '#2563EB', label: 'Blue' },
  { value: '#059669', label: 'Green' },
  { value: '#D97706', label: 'Amber' },
  { value: '#9333EA', label: 'Purple' },
  { value: '#DC2626', label: 'Red' },
  { value: '#0891B2', label: 'Cyan' }
];

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const tbody = document.getElementById('rows');
  const list = APP_DATA.schools.filter(s =>
    !q || s.name.toLowerCase().includes(q) || (s.nameLo || '').includes(q) || s.address.toLowerCase().includes(q)
  );
  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-6 text-center text-sm text-slate-400">${t('crud.none')}</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(s => `
    <tr class="border-t border-slate-100 hover:bg-slate-50">
      <td class="px-4 py-3">
        <div class="flex items-center gap-3">
          <span class="w-2 h-10 rounded-full" style="background:${s.color}"></span>
          <div>
            <div class="font-bold sr-brand-text">${srEscape(APP_LANG === 'lo' ? (s.nameLo || s.name) : s.name)}</div>
            <div class="text-xs text-slate-500">${srEscape(s.shortName)} · ${s.bellAm}/${s.bellPm}</div>
          </div>
        </div>
      </td>
      <td class="px-4 py-3 text-slate-600">${srEscape(s.address)}</td>
      <td class="px-4 py-3 text-slate-600 font-mono text-xs">${s.bellAm} – ${s.bellPm}</td>
      <td class="px-4 py-3 text-right tabular-nums font-bold">${s.students.toLocaleString()}</td>
      <td class="px-4 py-3">
        <span class="sr-pill ${s.status === 'active' ? 'on_time' : 'idle'}">
          <span class="dot"></span>${s.status === 'active' ? t('billing.active') : t('billing.expired')}
        </span>
      </td>
      <td class="px-4 py-3 text-right">
        <button onclick="editSchool('${s.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2">${t('crud.edit')}</button>
        <button onclick="deleteSchool('${s.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2 text-red-600">${t('crud.delete')}</button>
      </td>
    </tr>
  `).join('');
}

function fields(school = {}) {
  return [
    { key: 'name',     label: t('schoolsPage.name'),    type: 'text', required: true, placeholder: 'Vientiane International School' },
    { key: 'nameLo',   label: t('schoolsPage.nameLo'),  type: 'text', placeholder: 'ໂຮງຮຽນສາກົນວຽງຈັນ' },
    { key: 'shortName', label: 'Short name',            type: 'text', required: true, placeholder: 'VIS', hint: 'Used on map markers and tight UI spaces' },
    { key: 'address',  label: t('schoolsPage.address'), type: 'text', required: true, placeholder: 'Tha Ngon Road, Saysettha' },
    { key: 'bellAm',   label: t('schoolsPage.bellAm'),  type: 'time', required: true, default: '07:30' },
    { key: 'bellPm',   label: t('schoolsPage.bellPm'),  type: 'time', required: true, default: '14:30' },
    { key: 'students', label: t('schoolsPage.students'), type: 'number', required: true, default: 100 },
    { key: 'color',    label: t('schoolsPage.color'),   type: 'select', options: COLOR_OPTIONS, default: '#2563EB' },
    { key: 'status',   label: t('billing.status'),      type: 'select', options: [
        { value: 'active', label: t('billing.active') },
        { value: 'inactive', label: t('billing.expired') }
      ], default: 'active'
    }
  ];
}

document.getElementById('addBtn').addEventListener('click', () => {
  srModal({
    title: t('schoolsPage.addSchool'),
    fields: fields(),
    values: { color: '#2563EB', students: 100 },
    onSave: data => {
      const id = (data.shortName || 'sch').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 4) || ('s' + (APP_DATA.schools.length + 1));
      APP_DATA.schools.push({
        id,
        name: data.name,
        nameLo: data.nameLo || data.name,
        shortName: data.shortName,
        address: data.address,
        coords: [17.97, 102.61],
        bellAm: data.bellAm,
        bellPm: data.bellPm,
        color: data.color,
        students: data.students,
        status: data.status
      });
      APP_DATA.byId.school[id] = APP_DATA.schools[APP_DATA.schools.length - 1];
      srToast('✓ ' + t('crud.created'));
      render();
    }
  });
});

window.editSchool = function(id) {
  const s = APP_DATA.byId.school[id];
  srModal({
    title: t('crud.edit') + ' — ' + s.name,
    fields: fields(s),
    values: s,
    onSave: data => {
      Object.assign(s, {
        name: data.name,
        nameLo: data.nameLo || data.name,
        shortName: data.shortName,
        address: data.address,
        bellAm: data.bellAm,
        bellPm: data.bellPm,
        students: data.students,
        color: data.color,
        status: data.status
      });
      srToast('✓ ' + t('crud.saved'));
      render();
    }
  });
};

window.deleteSchool = function(id) {
  const s = APP_DATA.byId.school[id];
  srConfirm({
    title: t('crud.delete') + ' — ' + s.name,
    message: t('crud.confirmDelete'),
    danger: true,
    onYes: () => {
      const idx = APP_DATA.schools.findIndex(x => x.id === id);
      if (idx >= 0) APP_DATA.schools.splice(idx, 1);
      delete APP_DATA.byId.school[id];
      srToast('✓ ' + t('crud.deleted'));
      render();
    }
  });
};

document.getElementById('search').addEventListener('input', render);
render();
window.addEventListener('langchange', render);
</script>
</body>
</html>
