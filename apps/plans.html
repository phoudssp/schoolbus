<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeRide — Plans</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">

<header class="sr-gradient text-white sticky top-0 z-30">
  <div class="px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="../index.html" class="sr-logo text-white"><span class="sr-logo-mark">S</span><span data-i18n="brand">SafeRide</span></a>
      <nav id="topNav" class="hidden md:flex items-center gap-1 text-sm"></nav>
    </div>
    <button onclick="toggleLang()" class="sr-btn sr-btn-yellow text-sm px-3 py-1.5"><span data-i18n="languageSwitch">ລາວ</span></button>
  </div>
</header>

<main class="px-5 py-5 max-w-6xl mx-auto">

  <div class="text-sm text-slate-500 mb-2">
    <a href="manage.html" class="hover:underline" data-i18n="manage.title">Manage</a>
    <span class="mx-1">›</span>
    <span data-i18n="plansPage.title">Subscription plans</span>
  </div>

  <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
    <div>
      <h1 class="text-2xl font-extrabold sr-brand-text" data-i18n="plansPage.title">Subscription plans</h1>
      <p class="text-sm text-slate-500" data-i18n="plansPage.subtitle">Pricing tiers your school customers subscribe to.</p>
    </div>
    <button id="addBtn" class="sr-btn sr-btn-primary text-sm">➕ <span data-i18n="plansPage.addPlan">Add plan</span></button>
  </div>

  <div id="plansGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

</main>

<script src="../shared/i18n.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/crud.js"></script>
<script>
document.getElementById('topNav').innerHTML = srOperatorNav('manage');
document.querySelectorAll('#topNav [data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));

const FEATURE_OPTIONS = [
  { value: 'live_tracking',    label: 'Live GPS tracking' },
  { value: 'parent_app',       label: 'Parent mobile app' },
  { value: 'reports',          label: 'Reports & exports' },
  { value: 'sms_fallback',     label: 'SMS notifications' },
  { value: 'priority_support', label: '24/7 priority support' },
  { value: 'custom_branding',  label: 'Custom branding' }
];

function schoolsOnPlan(planId) {
  return APP_DATA.subscriptions.filter(s => s.planId === planId).length;
}

function render() {
  const wrap = document.getElementById('plansGrid');
  const plans = Object.values(APP_DATA.plans);
  wrap.innerHTML = plans.map((p, i) => {
    const featuredColor = i === 1 ? 'ring-2 ring-yellow-400' : '';
    const onPlan = schoolsOnPlan(p.id);
    return `
      <div class="sr-card p-5 flex flex-col ${featuredColor}">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-lg font-extrabold sr-brand-text">${srEscape(APP_LANG === 'lo' ? p.nameLo : p.name)}</h3>
          ${i === 1 ? `<span class="sr-pill on_time"><span class="dot"></span>Popular</span>` : ''}
        </div>
        <div class="mt-1">
          <span class="text-3xl font-extrabold sr-brand-text">${fmtMoney(p.perStudent)}</span>
          <span class="text-sm text-slate-500"> / ${t('schoolsPage.students').toLowerCase()} / ${t('billing.monthly').toLowerCase()}</span>
        </div>
        <ul class="mt-4 space-y-2 flex-1 text-sm">
          ${p.featureLabels.map(f => `<li class="flex items-start gap-2"><span class="text-emerald-600 mt-0.5">✓</span><span>${srEscape(f)}</span></li>`).join('')}
        </ul>
        <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
          <span>${onPlan} ${t('plansPage.schoolsOnPlan').toLowerCase()}</span>
        </div>
        <div class="mt-3 flex items-center gap-2">
          <button onclick="editPlan('${p.id}')" class="sr-btn sr-btn-primary text-xs flex-1">${t('crud.edit')}</button>
          <button onclick="duplicatePlan('${p.id}')" class="sr-btn sr-btn-ghost text-xs">${t('plansPage.duplicate')}</button>
          ${onPlan === 0 ? `<button onclick="deletePlan('${p.id}')" class="sr-btn sr-btn-ghost text-xs text-red-600">${t('crud.delete')}</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function fields(plan = null) {
  return [
    { key: 'id',          label: 'Plan ID',                       type: 'text',     required: true, readonly: !!plan, placeholder: 'pro' },
    { key: 'name',        label: t('plansPage.planName'),         type: 'text',     required: true, placeholder: 'Pro' },
    { key: 'nameLo',      label: t('plansPage.planName') + ' (Lao)', type: 'text', placeholder: 'ໂປຣ' },
    { key: 'perStudent',  label: t('plansPage.pricePerStudent'),  type: 'number',   required: true, default: 100000, hint: 'In Lao Kip (₭)' },
    { key: 'features',    label: t('plansPage.features'),         type: 'checkboxes', options: FEATURE_OPTIONS }
  ];
}

document.getElementById('addBtn').addEventListener('click', () => {
  srModal({
    title: t('plansPage.addPlan'),
    fields: fields(),
    values: { features: ['live_tracking', 'parent_app'] },
    onSave: data => {
      if (APP_DATA.plans[data.id]) { alert('Plan ID exists'); return false; }
      const p = {
        id: data.id,
        name: data.name,
        nameLo: data.nameLo || data.name,
        perStudent: data.perStudent,
        features: data.features || [],
        featureLabels: (data.features || []).map(f => FEATURE_OPTIONS.find(o => o.value === f)?.label || f)
      };
      APP_DATA.plans[data.id] = p;
      APP_DATA.byId.plan[data.id] = p;
      srToast('✓ ' + t('crud.created'));
      render();
    }
  });
});

window.editPlan = function(id) {
  const p = APP_DATA.plans[id];
  srModal({
    title: t('crud.edit') + ' — ' + p.name,
    fields: fields(p),
    values: p,
    onSave: data => {
      Object.assign(p, {
        name: data.name,
        nameLo: data.nameLo || data.name,
        perStudent: data.perStudent,
        features: data.features || [],
        featureLabels: (data.features || []).map(f => FEATURE_OPTIONS.find(o => o.value === f)?.label || f)
      });
      srToast('✓ ' + t('crud.saved'));
      render();
    }
  });
};

window.duplicatePlan = function(id) {
  const p = APP_DATA.plans[id];
  let newId = p.id + '-copy';
  let n = 2;
  while (APP_DATA.plans[newId]) { newId = p.id + '-copy-' + n++; }
  const copy = JSON.parse(JSON.stringify(p));
  copy.id = newId;
  copy.name = p.name + ' (copy)';
  APP_DATA.plans[newId] = copy;
  APP_DATA.byId.plan[newId] = copy;
  srToast('✓ ' + t('crud.created'));
  render();
};

window.deletePlan = function(id) {
  const p = APP_DATA.plans[id];
  srConfirm({
    title: t('crud.delete') + ' — ' + p.name,
    message: t('crud.confirmDelete'),
    danger: true,
    onYes: () => {
      delete APP_DATA.plans[id];
      delete APP_DATA.byId.plan[id];
      srToast('✓ ' + t('crud.deleted'));
      render();
    }
  });
};

render();
window.addEventListener('langchange', render);
</script>
</body>
</html>
