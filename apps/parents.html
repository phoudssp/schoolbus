<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeRide — Parent accounts</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">

<header class="sr-gradient text-white sticky top-0 z-30">
  <div class="px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="../index.html" class="sr-logo text-white"><span class="sr-logo-mark">S</span><span data-i18n="brand">SafeRide</span></a>
      <nav id="topNav" class="hidden md:flex items-center gap-1 text-sm"></nav>
    </div>
    <button onclick="toggleLang()" class="sr-btn sr-btn-yellow text-sm px-3 py-1.5"><span data-i18n="languageSwitch">ລາວ</span></button>
  </div>
</header>

<main class="px-5 py-5 max-w-7xl mx-auto">

  <div class="text-sm text-slate-500 mb-2">
    <a href="manage.html" class="hover:underline" data-i18n="manage.title">Manage</a>
    <span class="mx-1">›</span>
    <span data-i18n="parentsPage.title">Parent accounts</span>
  </div>

  <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
    <div>
      <h1 class="text-2xl font-extrabold sr-brand-text" data-i18n="parentsPage.title">Parent accounts</h1>
      <p class="text-sm text-slate-500" data-i18n="parentsPage.subtitle">Login accounts that parents use to access the app.</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <select id="statusFilter" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="invited">Invited</option>
        <option value="suspended">Suspended</option>
      </select>
      <input id="search" type="text" data-i18n-placeholder="crud.search" placeholder="Search…" class="border border-slate-300 rounded-md px-3 py-1.5 text-sm w-56">
      <button id="addBtn" class="sr-btn sr-btn-primary text-sm">➕ <span data-i18n="parentsPage.addParent">Add parent</span></button>
    </div>
  </div>

  <div class="sr-card overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="text-left px-4 py-2.5" data-i18n="parentsPage.parentName">Parent name</th>
          <th class="text-left px-4 py-2.5" data-i18n="parentsPage.email">Email</th>
          <th class="text-left px-4 py-2.5" data-i18n="parentsPage.phone">Phone</th>
          <th class="text-left px-4 py-2.5" data-i18n="parentsPage.children">Children</th>
          <th class="text-left px-4 py-2.5" data-i18n="parentsPage.account">Account</th>
          <th class="text-left px-4 py-2.5" data-i18n="parentsPage.lastLogin">Last login</th>
          <th class="text-right px-4 py-2.5"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

</main>

<script src="../shared/i18n.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/crud.js"></script>
<script>
document.getElementById('topNav').innerHTML = srOperatorNav('manage');
document.querySelectorAll('#topNav [data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));

const sf = document.getElementById('statusFilter');
sf.addEventListener('change', render);
document.getElementById('search').addEventListener('input', render);

function statusPill(s) {
  const map = {
    active:    { cls: 'on_time', label: t('parentsPage.activeAccount') },
    invited:   { cls: 'starting', label: t('parentsPage.invitedAccount') },
    suspended: { cls: 'late',    label: t('parentsPage.suspendedAccount') }
  };
  const m = map[s] || map.active;
  return `<span class="sr-pill ${m.cls}"><span class="dot"></span>${m.label}</span>`;
}

function fmtRel(iso) {
  if (!iso) return `<span class="text-slate-400">${t('parentsPage.neverLoggedIn')}</span>`;
  const d = new Date(iso);
  return d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
}

function studentsList() {
  return APP_DATA.students.map(s => {
    const sch = APP_DATA.byId.school[s.schoolId];
    return { value: s.id, label: `${s.name} (${sch.shortName} · ${s.grade})` };
  });
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const fs = sf.value;
  const tbody = document.getElementById('rows');
  const list = APP_DATA.guardians.filter(g => {
    if (fs && g.accountStatus !== fs) return false;
    if (q && !g.name.toLowerCase().includes(q) && !(g.email || '').toLowerCase().includes(q)) return false;
    return true;
  });
  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-6 text-center text-sm text-slate-400">${t('crud.none')}</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(g => {
    const initials = g.name.split(' ').map(p => p[0]).slice(0, 2).join('');
    const childCount = g.studentIds.length;
    const childNames = g.studentIds.slice(0, 2).map(id => {
      const s = APP_DATA.byId.student[id];
      return s ? s.name.split(' ')[0] : '?';
    }).join(', ') + (childCount > 2 ? ` +${childCount - 2}` : '');
    return `
      <tr class="border-t border-slate-100 hover:bg-slate-50">
        <td class="px-4 py-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center font-bold text-xs">${initials}</div>
            <div>
              <div class="font-bold sr-brand-text">${srEscape(g.name)}</div>
              <div class="text-xs text-slate-400 font-mono">${g.id}</div>
            </div>
          </div>
        </td>
        <td class="px-4 py-3 text-slate-600 text-xs">${srEscape(g.email || '—')}</td>
        <td class="px-4 py-3 font-mono text-xs text-slate-600">${srEscape(g.phone || '')}</td>
        <td class="px-4 py-3">
          <div class="font-bold">${childCount}</div>
          <div class="text-xs text-slate-500">${srEscape(childNames || '—')}</div>
        </td>
        <td class="px-4 py-3">${statusPill(g.accountStatus)}</td>
        <td class="px-4 py-3 text-slate-600 text-xs">${fmtRel(g.lastLogin)}</td>
        <td class="px-4 py-3 text-right whitespace-nowrap">
          ${g.accountStatus === 'invited'
            ? `<button onclick="sendInvite('${g.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2">📧 ${t('parentsPage.sendInvite')}</button>`
            : `<button onclick="resetPwd('${g.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2">🔑 ${t('parentsPage.resetPassword')}</button>`}
          <button onclick="editParent('${g.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2">${t('crud.edit')}</button>
          <button onclick="deleteParent('${g.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2 text-red-600">${t('crud.delete')}</button>
        </td>
      </tr>
    `;
  }).join('');
}

function fields() {
  return [
    { key: 'name',          label: t('parentsPage.parentName'), type: 'text', required: true, placeholder: 'Mr. Chanthavong' },
    { key: 'email',         label: t('parentsPage.email'),      type: 'email', required: true, placeholder: 'parent@example.la', hint: 'Used as the login email for the parent app.' },
    { key: 'phone',         label: t('parentsPage.phone'),      type: 'tel', placeholder: '+856 20 7771 0001' },
    { key: 'studentIds',    label: t('parentsPage.children'),   type: 'checkboxes', options: studentsList(), hint: 'Select all children that belong to this parent. Multi-school is OK.' },
    { key: 'accountStatus', label: t('parentsPage.account'),    type: 'select', default: 'invited', options: [
        { value: 'active',    label: t('parentsPage.activeAccount') },
        { value: 'invited',   label: t('parentsPage.invitedAccount') },
        { value: 'suspended', label: t('parentsPage.suspendedAccount') }
      ]
    }
  ];
}

document.getElementById('addBtn').addEventListener('click', () => {
  srModal({
    title: t('parentsPage.addParent'),
    fields: fields(),
    values: { studentIds: [], accountStatus: 'invited' },
    onSave: data => {
      const id = srNewId('G', APP_DATA.guardians);
      const g = {
        id,
        name: data.name,
        email: data.email,
        phone: data.phone || '',
        studentIds: data.studentIds || [],
        accountStatus: data.accountStatus,
        lastLogin: null,
        createdAt: new Date().toISOString().slice(0, 10)
      };
      APP_DATA.guardians.push(g);
      APP_DATA.byId.guardian[id] = g;
      // Link students to this guardian
      (g.studentIds || []).forEach(sid => {
        const s = APP_DATA.byId.student[sid];
        if (s) s.guardianId = id;
      });
      srToast('✓ ' + t('crud.created'));
      if (g.accountStatus === 'invited') {
        setTimeout(() => srToast('📧 ' + t('parentsPage.inviteSent') + ' → ' + g.email), 600);
      }
      render();
    }
  });
});

window.editParent = function(id) {
  const g = APP_DATA.byId.guardian[id];
  srModal({
    title: t('crud.edit') + ' — ' + g.name,
    fields: fields(),
    values: g,
    onSave: data => {
      const oldIds = new Set(g.studentIds || []);
      const newIds = new Set(data.studentIds || []);
      // Unlink removed
      oldIds.forEach(sid => {
        if (!newIds.has(sid)) {
          const s = APP_DATA.byId.student[sid];
          if (s && s.guardianId === id) s.guardianId = null;
        }
      });
      // Link added
      newIds.forEach(sid => {
        if (!oldIds.has(sid)) {
          const s = APP_DATA.byId.student[sid];
          if (s) s.guardianId = id;
        }
      });
      Object.assign(g, {
        name: data.name,
        email: data.email,
        phone: data.phone,
        studentIds: data.studentIds || [],
        accountStatus: data.accountStatus
      });
      srToast('✓ ' + t('crud.saved'));
      render();
    }
  });
};

window.deleteParent = function(id) {
  const g = APP_DATA.byId.guardian[id];
  srConfirm({
    title: t('crud.delete') + ' — ' + g.name,
    message: t('crud.confirmDelete'),
    danger: true,
    onYes: () => {
      // Unlink students
      g.studentIds.forEach(sid => {
        const s = APP_DATA.byId.student[sid];
        if (s && s.guardianId === id) s.guardianId = null;
      });
      const idx = APP_DATA.guardians.findIndex(x => x.id === id);
      if (idx >= 0) APP_DATA.guardians.splice(idx, 1);
      delete APP_DATA.byId.guardian[id];
      srToast('✓ ' + t('crud.deleted'));
      render();
    }
  });
};

window.sendInvite = function(id) {
  const g = APP_DATA.byId.guardian[id];
  srToast('📧 ' + t('parentsPage.inviteSent') + ' → ' + g.email);
};

window.resetPwd = function(id) {
  const g = APP_DATA.byId.guardian[id];
  srToast('🔑 ' + t('parentsPage.passwordReset') + ' → ' + g.email);
};

render();
window.addEventListener('langchange', render);
</script>
</body>
</html>
