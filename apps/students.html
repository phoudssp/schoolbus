<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeRide — Students</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    /* ============ Real-look student ID card ============ */
    .card-row { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
    .id-card {
      width: 480px;
      aspect-ratio: 1.586 / 1;     /* CR80 credit-card ratio */
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 14px 36px rgba(15, 30, 61, 0.18), 0 0 0 1px rgba(15,30,61,0.06);
      color: white;
      flex-shrink: 0;
    }
    /* FRONT */
    .card-front {
      background: linear-gradient(135deg, #0F1E3D 0%, #182B57 60%, #2A3F75 100%);
      padding: 18px 20px;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .card-front::before {
      /* decorative sweeping highlight */
      content: '';
      position: absolute; top: -40%; right: -30%;
      width: 70%; height: 180%;
      background: radial-gradient(circle, rgba(255,214,10,0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .cf-header { display: flex; align-items: center; justify-content: space-between; }
    .cf-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
    .cf-logo .mark {
      width: 26px; height: 26px; border-radius: 6px;
      background: var(--sr-yellow); color: var(--sr-navy);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px;
    }
    .cf-school-badge {
      font-size: 11px; font-weight: 800; padding: 3px 9px;
      border-radius: 999px; letter-spacing: 0.04em;
    }
    .cf-body {
      display: grid;
      grid-template-columns: 84px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 4px 0;
    }
    .cf-photo {
      width: 84px; height: 84px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid var(--sr-yellow);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 900; color: var(--sr-yellow);
    }
    .cf-info { min-width: 0; }
    .cf-name { font-size: 19px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
    .cf-grade { font-size: 13px; color: rgba(255,255,255,0.78); margin-top: 4px; }
    .cf-school-name { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 4px; line-height: 1.2; }
    .cf-tap {
      text-align: center; color: var(--sr-yellow);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .cf-tap-label {
      font-size: 9px; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .cf-tap-icon {
      width: 36px; height: 36px;
    }
    .cf-footer {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 10px; color: rgba(255,255,255,0.55);
      letter-spacing: 0.04em;
    }
    .cf-card-id { font-family: 'SF Mono', ui-monospace, monospace; font-weight: 700; color: var(--sr-yellow); }

    /* BACK */
    .card-back {
      background: white;
      color: var(--sr-navy);
      padding: 18px 20px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
    }
    .card-back .stripe {
      position: absolute; top: 26px; left: 0; right: 0; height: 32px;
      background: var(--sr-navy);
    }
    .cb-qr {
      background: white;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
      position: relative; z-index: 1;
    }
    .cb-info { font-size: 11px; line-height: 1.55; position: relative; z-index: 1; }
    .cb-info h4 { font-size: 13px; font-weight: 800; margin: 0 0 4px; color: var(--sr-navy); line-height: 1.2; }
    .cb-info .meta { color: #64748B; }
    .cb-info .meta-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; }
    .cb-info .uid { font-family: 'SF Mono', ui-monospace, monospace; font-size: 10px; color: #475569; word-break: break-all; }
    .cb-info .contact {
      margin-top: 10px; padding-top: 8px;
      border-top: 1px dashed #CBD5E1;
      font-size: 10px; color: #64748B;
    }

    /* Print */
    @page { size: A4; margin: 14mm; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 0; }
      .card-row { gap: 36px; }
      .id-card { box-shadow: 0 0 0 1px #94A3B8 !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

<header class="sr-gradient text-white sticky top-0 z-30">
  <div class="px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="../index.html" class="sr-logo text-white"><span class="sr-logo-mark">S</span><span data-i18n="brand">SafeRide</span></a>
      <nav id="topNav" class="hidden md:flex items-center gap-1 text-sm"></nav>
    </div>
    <button onclick="toggleLang()" class="sr-btn sr-btn-yellow text-sm px-3 py-1.5"><span data-i18n="languageSwitch">ລາວ</span></button>
  </div>
</header>

<main class="px-5 py-5 max-w-7xl mx-auto">

  <div class="text-sm text-slate-500 mb-2">
    <a href="manage.html" class="hover:underline" data-i18n="manage.title">Manage</a>
    <span class="mx-1">›</span>
    <span data-i18n="studentsPage.title">Students</span>
  </div>

  <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
    <div>
      <h1 class="text-2xl font-extrabold sr-brand-text" data-i18n="studentsPage.title">Students</h1>
      <p class="text-sm text-slate-500" data-i18n="studentsPage.subtitle">All registered students across your schools.</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <select id="schoolFilter" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white">
        <option value="">All schools</option>
      </select>
      <input id="search" type="text" data-i18n-placeholder="crud.search" placeholder="Search…" class="border border-slate-300 rounded-md px-3 py-1.5 text-sm w-56">
      <button id="addBtn" class="sr-btn sr-btn-primary text-sm">➕ <span data-i18n="studentsPage.registerStudent">Register student</span></button>
    </div>
  </div>

  <div class="sr-card overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="text-left px-4 py-2.5" data-i18n="studentsPage.studentName">Name</th>
          <th class="text-left px-4 py-2.5" data-i18n="studentsPage.grade">Grade</th>
          <th class="text-left px-4 py-2.5" data-i18n="schoolsPage.title">School</th>
          <th class="text-left px-4 py-2.5" data-i18n="parentsPage.parentName">Guardian</th>
          <th class="text-left px-4 py-2.5" data-i18n="studentsPage.stop">Home stop</th>
          <th class="text-left px-4 py-2.5" data-i18n="studentsPage.cardId">Card ID</th>
          <th class="text-right px-4 py-2.5"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

</main>

<script src="../shared/i18n.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/crud.js"></script>
<script>
document.getElementById('topNav').innerHTML = srOperatorNav('manage');
document.querySelectorAll('#topNav [data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));

// School filter
const sf = document.getElementById('schoolFilter');
APP_DATA.schools.forEach(s => {
  const o = document.createElement('option');
  o.value = s.id;
  o.textContent = s.name;
  sf.appendChild(o);
});
sf.addEventListener('change', render);
document.getElementById('search').addEventListener('input', render);

const GRADES = ['Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Grade 8'];

function stopOptions() {
  return Object.entries(APP_DATA.stops)
    .filter(([id, s]) => !s.isSchool)
    .map(([id, s]) => ({ value: id, label: s.name }));
}

function guardianOptions() {
  return [{ value: '', label: '— ' + t('crud.none') + ' —' }]
    .concat(APP_DATA.guardians.map(g => ({ value: g.id, label: `${g.name} (${g.phone})` })));
}

function schoolOptions() {
  return APP_DATA.schools.map(s => ({ value: s.id, label: s.name }));
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const filterSchool = sf.value;
  const tbody = document.getElementById('rows');
  const list = APP_DATA.students.filter(s => {
    if (filterSchool && s.schoolId !== filterSchool) return false;
    if (q && !s.name.toLowerCase().includes(q) && !s.id.toLowerCase().includes(q)) return false;
    return true;
  });
  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-6 text-center text-sm text-slate-400">${t('crud.none')}</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(s => {
    const school = APP_DATA.byId.school[s.schoolId];
    const guardian = APP_DATA.byId.guardian[s.guardianId];
    const stop = APP_DATA.stops[s.stopId];
    return `
      <tr class="border-t border-slate-100 hover:bg-slate-50">
        <td class="px-4 py-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center font-bold text-slate-600 text-xs">${s.photoInitials}</div>
            <div>
              <div class="font-semibold">${srEscape(s.name)}</div>
              <div class="text-xs text-slate-500 font-mono">${s.id}</div>
            </div>
          </div>
        </td>
        <td class="px-4 py-3 text-slate-600">${srEscape(s.grade)}</td>
        <td class="px-4 py-3"><span class="font-semibold" style="color:${school.color}">${srEscape(school.shortName)}</span></td>
        <td class="px-4 py-3 text-slate-600">${guardian ? srEscape(guardian.name) : '—'}</td>
        <td class="px-4 py-3 text-slate-600 text-xs">${stop ? srEscape(stop.name) : '—'}</td>
        <td class="px-4 py-3">
          <div class="flex items-center gap-1.5">
            <span class="font-mono text-xs bg-slate-100 px-2 py-0.5 rounded" title="QR token">${srEscape(s.qrToken)}</span>
            <span class="inline-flex items-center gap-0.5 text-xs px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 font-bold" title="NFC ${srEscape(s.nfcUid)}">📡</span>
          </div>
        </td>
        <td class="px-4 py-3 text-right whitespace-nowrap">
          <button onclick="viewCard('${s.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2">📇 ${t('studentsPage.qr')}</button>
          <button onclick="editStudent('${s.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2">${t('crud.edit')}</button>
          <button onclick="deleteStudent('${s.id}')" class="sr-btn sr-btn-ghost text-xs py-1 px-2 text-red-600">${t('crud.delete')}</button>
        </td>
      </tr>
    `;
  }).join('');
}

function studentFields() {
  return [
    { key: 'name',       label: t('studentsPage.studentName'), type: 'text',   required: true, placeholder: 'Noi Chanthavong' },
    { key: 'grade',      label: t('studentsPage.grade'),       type: 'select', required: true, options: GRADES, default: 'Grade 1' },
    { key: 'schoolId',   label: t('schoolsPage.title'),        type: 'select', required: true, options: schoolOptions() },
    { key: 'stopId',     label: t('studentsPage.stop'),        type: 'select', required: true, options: stopOptions() },
    { key: 'guardianId', label: t('studentsPage.linkGuardian'), type: 'select', options: guardianOptions(), hint: 'Add a new guardian via the Parents page first if not listed.' }
  ];
}

document.getElementById('addBtn').addEventListener('click', () => {
  srModal({
    title: t('studentsPage.registerStudent'),
    fields: studentFields(),
    onSave: data => {
      if (!data.name || !data.schoolId || !data.stopId) return false;
      const id = srNewId('S', APP_DATA.students);
      const school = APP_DATA.byId.school[data.schoolId];
      const shortPrefix = school.shortName.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3) || 'SR';
      const idNum = id.split('-')[1];
      const tok = `${shortPrefix}-${idNum}-${Math.random().toString(16).slice(2, 6).toUpperCase()}`;
      const today = new Date().toISOString().slice(0, 10);
      const student = {
        id,
        name: data.name,
        grade: data.grade,
        schoolId: data.schoolId,
        guardianId: data.guardianId || null,
        stopId: data.stopId,
        qrToken: tok,
        nfcUid: nfcUidFor(id),               // auto-issue NFC UID
        cardIssuedAt: today,
        photoInitials: data.name.split(' ').map(p => p[0]).slice(0, 2).join(''),
        registeredAt: today,
        status: 'active'
      };
      APP_DATA.students.push(student);
      APP_DATA.byId.student[id] = student;
      // Link guardian
      if (data.guardianId) {
        const g = APP_DATA.byId.guardian[data.guardianId];
        if (g && !g.studentIds.includes(id)) g.studentIds.push(id);
      }
      srToast('✓ ' + t('studentsPage.cardIssuedToast'));
      render();
      // Auto-show the issued card (front + back)
      setTimeout(() => viewCard(id), 200);
    }
  });
});

window.editStudent = function(id) {
  const s = APP_DATA.byId.student[id];
  srModal({
    title: t('crud.edit') + ' — ' + s.name,
    fields: studentFields(),
    values: s,
    onSave: data => {
      const oldGuardianId = s.guardianId;
      Object.assign(s, {
        name: data.name,
        grade: data.grade,
        schoolId: data.schoolId,
        stopId: data.stopId,
        guardianId: data.guardianId || null
      });
      // Re-link guardian if changed
      if (oldGuardianId && oldGuardianId !== data.guardianId) {
        const g = APP_DATA.byId.guardian[oldGuardianId];
        if (g) g.studentIds = g.studentIds.filter(sid => sid !== id);
      }
      if (data.guardianId && data.guardianId !== oldGuardianId) {
        const g = APP_DATA.byId.guardian[data.guardianId];
        if (g && !g.studentIds.includes(id)) g.studentIds.push(id);
      }
      srToast('✓ ' + t('crud.saved'));
      render();
    }
  });
};

window.deleteStudent = function(id) {
  const s = APP_DATA.byId.student[id];
  srConfirm({
    title: t('crud.delete') + ' — ' + s.name,
    message: t('crud.confirmDelete'),
    danger: true,
    onYes: () => {
      const idx = APP_DATA.students.findIndex(x => x.id === id);
      if (idx >= 0) APP_DATA.students.splice(idx, 1);
      delete APP_DATA.byId.student[id];
      // Unlink from guardian
      if (s.guardianId) {
        const g = APP_DATA.byId.guardian[s.guardianId];
        if (g) g.studentIds = g.studentIds.filter(sid => sid !== id);
      }
      srToast('✓ ' + t('crud.deleted'));
      render();
    }
  });
};

// ---------- Student ID card view (2-sided: NFC front + QR back) ----------
window.viewCard = function(id) {
  const s = APP_DATA.byId.student[id];
  const school = APP_DATA.byId.school[s.schoolId];
  const issuedFmt = new Date(s.cardIssuedAt || s.registeredAt).toLocaleDateString(
    APP_LANG === 'lo' ? 'lo-LA' : 'en-US', { year: 'numeric', month: 'short', day: 'numeric' });

  // Contactless / NFC SVG icon — dot + 3 arcs of increasing size
  const nfcIcon = `
    <svg class="cf-tap-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <circle cx="22" cy="50" r="6" fill="currentColor"/>
      <path d="M 38 28 Q 56 50 38 72"/>
      <path d="M 56 16 Q 84 50 56 84"/>
      <path d="M 74 4 Q 110 50 74 96" opacity="0.7"/>
    </svg>`;

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 overflow-y-auto';
  overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl max-w-3xl w-full my-4">
      <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between">
        <div>
          <h3 class="font-bold text-lg sr-brand-text">${t('studentsPage.qr')} — ${srEscape(s.name)}</h3>
          <p class="text-xs text-slate-500 mt-0.5">${t('studentsPage.cardIssued')} · ${issuedFmt}</p>
        </div>
        <button class="text-slate-400 hover:text-slate-700 text-xl" data-close>&times;</button>
      </div>

      <div id="printArea" class="px-6 py-7 bg-slate-50">
        <div class="card-row">

          <!-- ============== FRONT ============== -->
          <div>
            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 text-center" data-i18n="studentsPage.cardFront">FRONT</div>
            <div class="id-card card-front">
              <div class="cf-header">
                <div class="cf-logo">
                  <span class="mark">S</span>
                  <span>SafeRide</span>
                </div>
                <span class="cf-school-badge" style="background:${school.color}; color:white;">${srEscape(school.shortName)}</span>
              </div>
              <div class="cf-body">
                <div class="cf-photo">${srEscape(s.photoInitials)}</div>
                <div class="cf-info">
                  <div class="cf-name">${srEscape(s.name)}</div>
                  <div class="cf-grade">${srEscape(s.grade)}</div>
                  <div class="cf-school-name">${srEscape(APP_LANG === 'lo' ? (school.nameLo || school.name) : school.name)}</div>
                </div>
                <div class="cf-tap">
                  ${nfcIcon}
                  <span class="cf-tap-label">TAP</span>
                </div>
              </div>
              <div class="cf-footer">
                <span>STUDENT ID</span>
                <span class="cf-card-id">${srEscape(s.qrToken)}</span>
              </div>
            </div>
          </div>

          <!-- ============== BACK ============== -->
          <div>
            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 text-center" data-i18n="studentsPage.cardBack">BACK</div>
            <div class="id-card card-back">
              <div class="stripe"></div>
              <div class="cb-qr">
                <img id="qrImg" alt="QR" width="130" height="130" style="display:block;">
              </div>
              <div class="cb-info">
                <h4>${srEscape(APP_LANG === 'lo' ? (school.nameLo || school.name) : school.name)}</h4>
                <div class="meta">${t('studentsPage.cardInstructions')}</div>
                <div class="meta-row">
                  <span class="text-slate-500">${t('studentsPage.issuedOn')}</span>
                  <span class="font-semibold">${issuedFmt}</span>
                </div>
                <div class="meta-row">
                  <span class="text-slate-500">${t('studentsPage.nfcUid')}</span>
                  <span class="uid">${srEscape(s.nfcUid)}</span>
                </div>
                <div class="contact">
                  Lost? Call SafeRide<br>+856 21 555 0100 · saferide.la
                </div>
              </div>
            </div>
          </div>

        </div>

        <!-- legend below -->
        <div class="mt-5 grid grid-cols-2 gap-3 max-w-3xl mx-auto text-xs">
          <div class="bg-white rounded-lg p-3 border border-slate-200">
            <div class="flex items-center gap-2 mb-1 font-bold sr-brand-text">📡 ${t('nfcTap')}</div>
            <div class="text-slate-600">UID: <span class="font-mono">${srEscape(s.nfcUid)}</span></div>
          </div>
          <div class="bg-white rounded-lg p-3 border border-slate-200">
            <div class="flex items-center gap-2 mb-1 font-bold sr-brand-text">📷 ${t('qrScan')}</div>
            <div class="text-slate-600">Token: <span class="font-mono">${srEscape(s.qrToken)}</span></div>
          </div>
        </div>
      </div>

      <div class="px-5 py-3 border-t border-slate-200 flex justify-end gap-2 bg-white rounded-b-2xl">
        <button class="sr-btn sr-btn-ghost" data-close>${t('crud.close')}</button>
        <button onclick="window.print()" class="sr-btn sr-btn-yellow">🖨 ${t('studentsPage.printQr')}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => overlay.remove()));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  // Render QR on the back (synchronous via qrcode-generator)
  try {
    const qr = qrcode(0, 'M');
    qr.addData(s.qrToken);
    qr.make();
    const img = overlay.querySelector('#qrImg');
    if (img) img.src = qr.createDataURL(5, 0);
  } catch (e) { console.error(e); }
};

// Tiny escaper helper exposed globally so we can use in toast above
function s_safe(s) { return srEscape(s); }

render();
window.addEventListener('langchange', render);

// Auto-open card view when ?card=ID is present (handy for direct demo links)
(function () {
  const cardId = new URLSearchParams(location.search).get('card');
  if (cardId && APP_DATA.byId.student[cardId]) {
    setTimeout(() => viewCard(cardId), 100);
  }
})();
</script>
</body>
</html>
