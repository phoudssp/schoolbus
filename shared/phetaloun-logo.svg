<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 96" font-family="Inter, 'Segoe UI', sans-serif" aria-label="Phetaloun">
  <!-- Cyan swoosh: a curve that sweeps across with an arrowhead, evoking the motion mark in the Phetaloun Logistics logo -->
  <defs>
    <linearGradient id="ph-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29ABE2"/>
      <stop offset="1" stop-color="#1B95C9"/>
    </linearGradient>
  </defs>
  <!-- Wide swoosh under and through the wordmark -->
  <path d="M 6 78 Q 70 8 140 28 Q 200 44 268 18"
        fill="none" stroke="url(#ph-cyan)" stroke-width="6" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <path d="M 252 11 L 270 18 L 254 28"
        fill="none" stroke="#1B95C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="14" y="64" font-size="40" font-weight="900" fill="#0E4D92" letter-spacing="-1">Phetaloun</text>

  <!-- Sub-tagline (replaces "LOGISTICS") -->
  <text x="72" y="84" font-size="11" font-weight="800" fill="#29ABE2" letter-spacing="6">S C H O O L B U S</text>
</svg>
