<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeRide Parent — Absence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../shared/style.css">
<style>body { background: linear-gradient(180deg, #0F1E3D 0%, #182B57 100%); display: flex; justify-content: center; padding: 28px 14px; min-height: 100vh; }</style>
</head><body>

<div style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
  <a href="index.html" style="color: white; text-decoration: none; font-size: 13px;"><i data-lucide="arrow-left" style="vertical-align:middle; width:16px;height:16px;"></i> Home</a>

  <div class="sr-phone-frame"><div class="sr-phone-notch"></div><div class="sr-phone-screen" style="display:flex; flex-direction: column;">
    <div style="padding: 14px 24px 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700;"><span>07:08</span><span><i data-lucide="battery-full" style="width:18px;height:13px;"></i></span></div>
    <div style="padding: 12px 20px 4px;"><strong style="font-size: 18px;">Absence requests</strong><div class="text-text-3" style="font-size: 11px; margin-top: 2px;">Let the school know in advance</div></div>

    <div style="flex: 1; overflow-y: auto; padding: 14px 20px 80px;">

      <button id="newBtn" class="sr-btn sr-btn-yellow" style="width: 100%; padding: 14px; font-size: 14px;"><i data-lucide="plus"></i>New absence request</button>

      <div style="margin-top: 18px;">
        <strong style="font-size: 13px;">Your requests</strong>
        <div id="list" style="margin-top: 8px;"></div>
      </div>

    </div>

    <nav class="sr-tabbar">
      <a href="index.html" class="sr-tab"><i data-lucide="home"></i><span>Home</span></a>
      <a href="child.html?id=S-1001" class="sr-tab"><i data-lucide="users"></i><span>Children</span></a>
      <a href="scores.html" class="sr-tab"><i data-lucide="award"></i><span>Scores</span></a>
      <a href="absence.html" class="sr-tab active"><i data-lucide="calendar-x"></i><span>Absence</span></a>
      <a href="settings.html" class="sr-tab"><i data-lucide="user"></i><span>Profile</span></a>
    </nav>
  </div></div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/ui.js"></script>
<script>
const guardian = APP_DATA.byId.guardian['G-001'];
const kids = guardian.studentIds.map(id => APP_DATA.byId.student[id]);

function render() {
  const list = APP_DATA.absences.filter(a => a.requestedBy === guardian.id).sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById('list').innerHTML = list.map(a => {
    const stu = APP_DATA.byId.student[a.studentId];
    const cls = a.status === 'approved' ? 'success' : a.status === 'denied' ? 'danger' : 'warn';
    const icon = a.status === 'approved' ? 'check-circle' : a.status === 'denied' ? 'x-circle' : 'hourglass';
    return `
      <div style="background: white; border: 1px solid var(--sr-border); border-radius: 12px; padding: 14px; margin-bottom: 10px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="sr-avatar" style="background: rgba(244,63,94,0.12); color: var(--sr-rose);">${srInitials(stu.name)}</div>
            <div><div style="font-weight: 700; font-size: 13px;">${srEscape(stu.name.split(' ')[0])}</div><div class="text-text-3" style="font-size: 11px;">${srFmtDate(a.date)}</div></div>
          </div>
          <span class="sr-pill ${cls}"><i data-lucide="${icon}" style="width:11px;height:11px;"></i>${a.status}</span>
        </div>
        <div style="margin-top: 8px; font-size: 12px; color: var(--sr-text-2);">"${srEscape(a.reason)}"</div>
        ${a.schoolNote ? `<div style="margin-top: 6px; padding: 8px 10px; background: var(--sr-bg); border-radius: 8px; font-size: 11px;"><strong>School:</strong> ${srEscape(a.schoolNote)}</div>` : ''}
        <div class="text-text-3" style="font-size: 10px; margin-top: 6px;">Requested ${srRelTime(a.requestedAt)}</div>
      </div>
    `;
  }).join('') || '<div class="sr-empty"><i data-lucide="calendar-check"></i><div>No requests yet</div></div>';
  srIcons();
}

document.getElementById('newBtn').addEventListener('click', () => srModal({
  title: 'Request absence',
  fields: [
    { key: 'studentId', label: 'Child', type: 'select', required: true, options: kids.map(k => ({ value: k.id, label: k.name + ' · ' + k.grade })) },
    { key: 'date', label: 'Absence date', type: 'date', required: true, default: '2026-05-12' },
    { key: 'reason', label: 'Reason', type: 'textarea', required: true, placeholder: 'e.g. Doctor appointment, family event…', rows: 3 }
  ],
  onSave: data => {
    const a = { id: 'ABS-' + (APP_DATA.absences.length + 1).toString().padStart(3, '0'), ...data, requestedAt: new Date().toISOString(), requestedBy: guardian.id, status: 'requested', schoolNote: '' };
    APP_DATA.absences.push(a);
    srToast('✓ Sent to school for approval');
    render();
  }
}));

render();
</script></body></html>
