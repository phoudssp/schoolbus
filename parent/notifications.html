<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeRide Parent — Notifications</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../shared/style.css">
<style>body { background: linear-gradient(180deg, #0F1E3D 0%, #182B57 100%); display: flex; justify-content: center; padding: 28px 14px; min-height: 100vh; }</style>
</head><body>
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
  <a href="index.html" style="color: white; text-decoration: none; font-size: 13px;"><i data-lucide="arrow-left" style="vertical-align:middle; width:16px;height:16px;"></i> Home</a>
  <div class="sr-phone-frame"><div class="sr-phone-notch"></div><div class="sr-phone-screen" style="display:flex; flex-direction: column;">
    <div style="padding: 14px 24px 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700;"><span>07:08</span><span><i data-lucide="battery-full" style="width:18px;height:13px;"></i></span></div>
    <div style="padding: 12px 20px 8px;"><strong style="font-size: 18px;">Notifications</strong></div>
    <div style="flex: 1; overflow-y: auto; padding: 0 20px 80px;" id="list"></div>
    <nav class="sr-tabbar">
      <a href="index.html" class="sr-tab active"><i data-lucide="home"></i><span>Home</span></a>
      <a href="child.html?id=S-1001" class="sr-tab"><i data-lucide="users"></i><span>Children</span></a>
      <a href="scores.html" class="sr-tab"><i data-lucide="award"></i><span>Scores</span></a>
      <a href="absence.html" class="sr-tab"><i data-lucide="calendar-x"></i><span>Absence</span></a>
      <a href="settings.html" class="sr-tab"><i data-lucide="user"></i><span>Profile</span></a>
    </nav>
  </div></div>
</div>
<script src="../shared/data.js"></script>
<script src="../shared/ui.js"></script>
<script>
const guardian = APP_DATA.byId.guardian['G-001'];
const ICONS = { board: 'log-in', arrived: 'school', return: 'log-in', dropped: 'home', absence: 'calendar-x', score: 'award', approach: 'navigation' };
const COLORS = { board: 'green', arrived: 'blue', return: 'green', dropped: 'green', absence: 'amber', score: 'purple', approach: 'cyan' };
document.getElementById('list').innerHTML = APP_DATA.notifications.filter(n => n.guardianId === guardian.id).map(n => {
  const stu = APP_DATA.byId.student[n.studentId];
  return `
    <div style="display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--sr-border); ${n.read ? 'opacity:0.7;' : ''}">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: rgba(85,112,241,0.1); color: var(--sr-blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><i data-lucide="${ICONS[n.type] || 'bell'}"></i></div>
      <div style="flex: 1;">
        <div style="display: flex; justify-content: space-between; align-items: start;">
          <div style="font-weight: ${n.read ? '500' : '700'}; font-size: 13px;">${srEscape(n.title)}</div>
          ${!n.read ? '<span style="width: 8px; height: 8px; background: var(--sr-blue); border-radius: 50%; margin-top: 4px;"></span>' : ''}
        </div>
        <div class="text-text-3" style="font-size: 11px;">${srEscape(n.body)}</div>
        <div class="text-text-4" style="font-size: 10px; margin-top: 2px;">${srRelTime(n.createdAt)}</div>
      </div>
    </div>
  `;
}).join('');
srIcons();
</script></body></html>
